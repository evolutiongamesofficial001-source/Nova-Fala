<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar • Nova-Fala</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{box-sizing:border-box;}

:root{
    --bg:#08090b;
    --card:#111318;
    --card-2:#15171d;
    --border:#1e2128;
    --blue:#1d9bf0;
    --violet:#7c3aed;
    --grad:linear-gradient(135deg,#1d9bf0,#7c3aed);
    --text:#f1f2f4;
    --sub:#8b8f98;
    --danger:#ff5c72;
}

body{
    margin:0;
    font-family:'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    background:
        radial-gradient(1200px 700px at 50% -10%, rgba(29,155,240,0.10), transparent 60%),
        radial-gradient(900px 500px at 100% 100%, rgba(124,58,237,0.08), transparent 60%),
        var(--bg);
    color:var(--text);
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:20px;
    -webkit-font-smoothing:antialiased;
}

::selection{ background:rgba(29,155,240,0.35); color:#fff; }

/* CARD */
.card{
    width:100%;
    max-width:400px;
    background:rgba(17,19,24,0.85);
    border:1px solid var(--border);
    border-radius:22px;
    padding:28px 28px 32px;
    box-shadow:0 20px 60px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,0.02);
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
    animation:cardIn .5s cubic-bezier(.19,1,.22,1) both;
}

@keyframes cardIn{
    from{ opacity:0; transform:translateY(16px) scale(.97); }
    to{ opacity:1; transform:translateY(0) scale(1); }
}

@keyframes gradientShift {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

/* LOGO */
.logo{
    text-align:center;
    font-size:30px;
    font-weight:800;
    letter-spacing:-0.8px;
    margin-bottom:6px;
    background: linear-gradient(90deg, #7c3aed, #6d28d9, #4f46e5, #3b82f6, #60a5fa);
    background-size: 200% auto;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: gradientShift 3s ease infinite;
}

.subtitle{
    text-align:center;
    font-size:13.5px;
    color:var(--sub);
    margin-bottom:22px;
    transition:opacity .15s;
}

/* ===== ABAS ===== */
.tabs{
    display:flex;
    background:var(--card-2);
    border:1px solid var(--border);
    border-radius:14px;
    padding:4px;
    margin-bottom:22px;
    position:relative;
}

.tab-btn{
    flex:1;
    padding:10px 0;
    text-align:center;
    font-size:14px;
    font-weight:700;
    color:var(--sub);
    background:none;
    border:none;
    cursor:pointer;
    border-radius:10px;
    position:relative;
    z-index:2;
    transition:color .25s;
    font-family:inherit;
    box-shadow:none;
}

.tab-btn.active{ color:#fff; }

.tab-indicator{
    position:absolute;
    top:4px;
    left:4px;
    width:calc(50% - 4px);
    height:calc(100% - 8px);
    background:var(--grad);
    border-radius:10px;
    transition:transform .3s cubic-bezier(.65,0,.35,1);
    box-shadow:0 4px 14px rgba(29,155,240,0.3);
    z-index:1;
}

.tabs[data-active="registro"] .tab-indicator{
    transform:translateX(100%);
}

/* ===== FORMULÁRIOS ===== */
.form-panel{ display:none; }
.form-panel.active{ display:block; animation:panelIn .3s ease both; }

@keyframes panelIn{
    from{ opacity:0; transform:translateY(6px); }
    to{ opacity:1; transform:translateY(0); }
}

.field{ position:relative; margin-top:12px; }
.field:first-of-type{ margin-top:0; }

.field-label{
    display:block;
    font-size:11.5px;
    font-weight:600;
    color:var(--sub);
    letter-spacing:0.3px;
    text-transform:uppercase;
    margin-bottom:6px;
}

input{
    width:100%;
    padding:13px 14px;
    background:var(--card-2);
    border:1px solid var(--border);
    color:var(--text);
    border-radius:12px;
    transition:border-color .2s, box-shadow .2s, background .2s;
    font-size:14.5px;
    font-family:inherit;
    outline:none;
    color-scheme:dark;
}

input::placeholder{ color:#5c6068; }

input:focus{
    border-color:var(--blue);
    background:#131620;
    box-shadow:0 0 0 3px rgba(29,155,240,0.12);
}

.field.has-toggle input{ padding-right:44px; }

.toggle-pass{
    position:absolute;
    right:6px;
    top:50%;
    transform:translateY(-50%);
    width:32px;
    height:32px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:transparent;
    border:none;
    color:var(--sub);
    cursor:pointer;
    border-radius:8px;
    transition:.2s;
    padding:0;
    margin:0;
}
.field.has-toggle.with-label .toggle-pass{ top:31px; transform:none; }

.toggle-pass:hover{ color:var(--text); background:rgba(255,255,255,0.06); box-shadow:none; }

/* FORÇA DA SENHA */
.pass-strength{ display:flex; gap:4px; margin-top:8px; }
.pass-strength span{ height:3px; flex:1; border-radius:3px; background:var(--border); transition:background .25s; }
.pass-strength.fraca span:nth-child(1){ background:var(--danger); }
.pass-strength.media span:nth-child(1),
.pass-strength.media span:nth-child(2){ background:#f5a623; }
.pass-strength.forte span{ background:#2ee6a6; }

/* BOTÃO */
button.btn-primary{
    width:100%;
    padding:14px;
    margin-top:22px;
    background:var(--grad);
    border:none;
    border-radius:12px;
    color:white;
    font-size:15.5px;
    font-weight:700;
    cursor:pointer;
    transition:transform .15s, box-shadow .2s, opacity .2s;
    box-shadow:0 8px 24px rgba(29,155,240,0.3);
    font-family:inherit;
}
button.btn-primary:hover{ transform:translateY(-1px); box-shadow:0 10px 28px rgba(124,58,237,0.4); opacity:.96; }
button.btn-primary:active{ transform:translateY(0) scale(0.98); }
button.btn-primary:disabled{ opacity:.55; cursor:not-allowed; transform:none; box-shadow:none; }

/* LINK secundário embaixo do form (troca de aba) */
.link{
    text-align:center;
    margin-top:18px;
    font-size:14px;
    color:var(--sub);
}
.link button.link-btn{
    background:none;border:none;box-shadow:none;margin:0;padding:0;width:auto;
    color:var(--blue);
    text-decoration:none;
    font-weight:600;
    cursor:pointer;
    font-size:14px;
    font-family:inherit;
    transition:opacity .2s;
}
.link button.link-btn:hover{ opacity:.8; text-decoration:underline; transform:none; box-shadow:none; }

/* MENSAGEM */
.msg{ display:none; margin-top:14px; padding:10px 13px; border-radius:10px; font-size:13px; line-height:1.4; text-align:center; }
.msg.erro{ display:block; background:rgba(255,92,114,0.1); border:1px solid rgba(255,92,114,0.25); color:#ff8a9a; }
.msg.sucesso{ display:block; background:rgba(46,230,166,0.1); border:1px solid rgba(46,230,166,0.25); color:#5eeac2; }

</style>
</head>

<body>

<div class="card">

<div class="logo">Nova-Fala</div>
<div class="subtitle" id="subtitle">Entre na sua conta para continuar</div>

<div class="tabs" id="tabs" data-active="login">
    <div class="tab-indicator"></div>
    <button type="button" class="tab-btn active" id="tabLoginBtn" onclick="mudarAba('login')">Entrar</button>
    <button type="button" class="tab-btn" id="tabRegistroBtn" onclick="mudarAba('registro')">Criar conta</button>
</div>

<!-- ===== LOGIN ===== -->
<div class="form-panel active" id="painelLogin">

    <div class="field">
        <input id="user" placeholder="Usuário" autocomplete="username">
    </div>

    <div class="field has-toggle">
        <input id="pass" type="password" placeholder="Senha" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()">
        <button type="button" class="toggle-pass" onclick="alternarSenha('pass','eyeIcon1')" aria-label="Mostrar senha">
            <svg id="eyeIcon1" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
    </div>

    <div id="msgLogin" class="msg"></div>

    <button class="btn-primary" id="btnLogin" onclick="login()">Entrar</button>

    <div class="link">
        Não tem conta? <button type="button" class="link-btn" onclick="mudarAba('registro')">Criar conta</button>
    </div>

</div>

<!-- ===== REGISTRO ===== -->
<div class="form-panel" id="painelRegistro">

    <div class="field">
        <span class="field-label">Usuário</span>
        <input id="rUser" placeholder="Como quer ser chamado" autocomplete="username">
    </div>

    <div class="field">
        <span class="field-label">Email</span>
        <input id="rEmail" type="email" placeholder="seu@email.com" autocomplete="email">
    </div>

    <div class="field has-toggle with-label">
        <span class="field-label">Senha</span>
        <input id="rPass" type="password" placeholder="Mínimo 6 caracteres" autocomplete="new-password" oninput="atualizarForca()">
        <button type="button" class="toggle-pass" onclick="alternarSenha('rPass','eyeIcon2')" aria-label="Mostrar senha">
            <svg id="eyeIcon2" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
        <div class="pass-strength" id="passForca"><span></span><span></span><span></span></div>
    </div>

    <div class="field has-toggle with-label">
        <span class="field-label">Confirmar senha</span>
        <input id="rPass2" type="password" placeholder="Repita a senha" autocomplete="new-password">
        <button type="button" class="toggle-pass" onclick="alternarSenha('rPass2','eyeIcon3')" aria-label="Mostrar senha">
            <svg id="eyeIcon3" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
    </div>

    <div class="field">
        <span class="field-label">Data de nascimento</span>
        <input id="dob" type="date">
    </div>

    <div id="msgRegistro" class="msg"></div>

    <button class="btn-primary" id="btnRegistrar" onclick="registrar()">Criar conta</button>

    <div class="link">
        Já tem conta? <button type="button" class="link-btn" onclick="mudarAba('login')">Entrar</button>
    </div>

</div>

</div>

<script>

const DB = "https://contaevilution-default-rtdb.firebaseio.com"

/* ================= ABAS ================= */

function mudarAba(aba){
    let tabs = document.getElementById("tabs")
    tabs.dataset.active = aba

    document.getElementById("tabLoginBtn").classList.toggle("active", aba==="login")
    document.getElementById("tabRegistroBtn").classList.toggle("active", aba==="registro")
    document.getElementById("painelLogin").classList.toggle("active", aba==="login")
    document.getElementById("painelRegistro").classList.toggle("active", aba==="registro")
    document.getElementById("subtitle").textContent = aba==="login"
        ? "Entre na sua conta para continuar"
        : "Crie sua conta e comece a se conectar"
    document.title = aba==="login" ? "Entrar • Nova-Fala" : "Registro • Nova-Fala"

    // mantém a URL condizente sem recarregar a página
    let novaUrl = aba==="login" ? "login.html" : "registro.html"
    history.replaceState(null, "", novaUrl)
}

/* ================= MOSTRAR/OCULTAR SENHA ================= */

function alternarSenha(inputId, iconId){
    let campo = document.getElementById(inputId)
    let icon = document.getElementById(iconId)
    let mostrando = campo.type === "text"
    campo.type = mostrando ? "password" : "text"
    icon.innerHTML = mostrando
        ? '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>'
        : '<path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a18.6 18.6 0 0 1 5.06-5.94M9.9 4.24A10.4 10.4 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>'
}

/* ================= FORÇA DA SENHA (visual) ================= */

function atualizarForca(){
    let p = document.getElementById("rPass").value
    let el = document.getElementById("passForca")
    el.classList.remove("fraca","media","forte")
    if(!p) return
    let pontos = 0
    if(p.length >= 6) pontos++
    if(p.length >= 10 && /[0-9]/.test(p) && /[a-zA-Z]/.test(p)) pontos++
    if(p.length >= 10 && /[^a-zA-Z0-9]/.test(p)) pontos++
    if(pontos <= 1) el.classList.add("fraca")
    else if(pontos === 2) el.classList.add("media")
    else el.classList.add("forte")
}

/* ================= MENSAGENS ================= */

function mostrarMsg(elId, txt, tipo){
    let el = document.getElementById(elId)
    el.textContent = txt
    el.classList.remove("erro","sucesso")
    el.classList.add(tipo)
}
function limparMsg(elId){
    let el = document.getElementById(elId)
    el.textContent = ""
    el.classList.remove("erro","sucesso")
}

/* ================= SALVAR USUÁRIO (login) ================= */

function salvarUsuario(user){
    localStorage.setItem("user", user)
    sessionStorage.setItem("user", user)
    let d = new Date()
    d.setTime(d.getTime() + (30*24*60*60*1000)) // 30 dias
    document.cookie = "user=" + user + ";expires=" + d.toUTCString() + ";path=/"
}

/* ================= LOGIN ================= */

async function login(){

    limparMsg("msgLogin")

    let u = document.getElementById("user").value.trim()
    let p = document.getElementById("pass").value.trim()

    if(!u || !p){
        mostrarMsg("msgLogin", "Preencha usuário e senha", "erro")
        return
    }

    let btn = document.getElementById("btnLogin")
    btn.disabled = true
    btn.textContent = "Entrando..."

    try{
        let r = await fetch(DB+"/users/"+u+".json")
        let data = await r.json()

        if(!data){
            mostrarMsg("msgLogin", "Conta não existe", "erro")
            btn.disabled = false
            btn.textContent = "Entrar"
            return
        }

        if(data.senha != p){
            mostrarMsg("msgLogin", "Senha errada", "erro")
            btn.disabled = false
            btn.textContent = "Entrar"
            return
        }

        salvarUsuario(u)
        localStorage.removeItem("logoutManual")
        location.href="index.html"

    }catch(e){
        mostrarMsg("msgLogin", "Erro de conexão", "erro")
        btn.disabled = false
        btn.textContent = "Entrar"
    }
}

/* ================= REGISTRO ================= */

async function registrar(){

limparMsg("msgRegistro")
let btn = document.getElementById("btnRegistrar")

try{

let u = document.getElementById("rUser").value.trim()
let e = document.getElementById("rEmail").value.trim().toLowerCase()
let p = document.getElementById("rPass").value.trim()
let p2 = document.getElementById("rPass2").value.trim()
let dob = document.getElementById("dob").value

if(!u || !e || !p || !p2 || !dob){
mostrarMsg("msgRegistro", "Preencha todos os campos", "erro")
return
}

if(/[.#$/\[\]]/.test(u)){
mostrarMsg("msgRegistro", "Usuário inválido (não use . # $ [ ] / )", "erro")
return
}

let hoje = new Date()
let nasc = new Date(dob)
let idade = hoje.getFullYear() - nasc.getFullYear()
let m = hoje.getMonth() - nasc.getMonth()
if(m < 0 || (m === 0 && hoje.getDate() < nasc.getDate())) idade--

if(idade < 12){
mostrarMsg("msgRegistro", "Você precisa ter pelo menos 12 anos", "erro")
return
}

if(p !== p2){
mostrarMsg("msgRegistro", "Senhas diferentes", "erro")
return
}

btn.disabled = true
btn.textContent = "Criando conta..."

let checkUser = await fetch(DB + "/users/" + u + ".json")
let userData = null
try{ userData = await checkUser.json() }catch{}

if(userData){
mostrarMsg("msgRegistro", "Usuário já existe", "erro")
btn.disabled = false
btn.textContent = "Criar conta"
return
}

let checkAll = await fetch(DB + "/users.json")
let allUsers = null
try{ allUsers = await checkAll.json() }catch{}

if(allUsers){
for(let key in allUsers){
if(allUsers[key].email === e){
mostrarMsg("msgRegistro", "Email já cadastrado", "erro")
btn.disabled = false
btn.textContent = "Criar conta"
return
}
}
}

let salvar = await fetch(DB + "/users/" + u + ".json",{
method:"PUT",
headers:{ "Content-Type":"application/json" },
body:JSON.stringify({ email:e, senha:p, criado:Date.now() })
})

let resposta = await salvar.text()

if(!salvar.ok){
mostrarMsg("msgRegistro", "Erro ao salvar: " + resposta, "erro")
btn.disabled = false
btn.textContent = "Criar conta"
return
}

mostrarMsg("msgRegistro", "Conta criada com sucesso! Entrando...", "sucesso")
setTimeout(()=>{
document.getElementById("user").value = u
mudarAba("login")
document.getElementById("pass").focus()
btn.disabled = false
btn.textContent = "Criar conta"
}, 900)

}catch(err){
mostrarMsg("msgRegistro", "Erro: " + err.message, "erro")
console.error(err)
btn.disabled = false
btn.textContent = "Criar conta"
}
}

/* ================= INIT: escolhe a aba pela URL + auto-login ================= */

(function(){
    // aba inicial de acordo com o arquivo acessado
    let path = location.pathname.toLowerCase()
    if(path.endsWith("registro.html")){
        mudarAba("registro")
    }

    // entra automático se já tiver sessão salva
    let logoutManual = localStorage.getItem("logoutManual")
    let user =
        localStorage.getItem("user") ||
        sessionStorage.getItem("user") ||
        (document.cookie.match(/(^| )user=([^;]+)/)?.[2])

    if(user && logoutManual !== "true"){
        location.href="index.html"
    }
})()

</script>

</body>
</html>
