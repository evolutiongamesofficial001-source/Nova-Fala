<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EvoChat</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080b10;
  --panel:#0d1117;
  --card:#111720;
  --border:#1c2333;
  --border2:#243047;
  --blue:#3b82f6;
  --blue2:#60a5fa;
  --green:#10d48e;
  --green2:#34d399;
  --text:#e2e8f0;
  --sub:#64748b;
  --sub2:#94a3b8;
  --msg-in:#131c2e;
  --msg-out:#1a2f50;
  --accent:#3b82f6;
  --violet:#7c3aed;
  --grad: linear-gradient(135deg,#3b82f6,#7c3aed);
}
*{ scrollbar-width:thin; scrollbar-color:#1e2a40 transparent; }
::selection{ background:rgba(59,130,246,.35); color:#fff; }
button:focus-visible, input:focus-visible, textarea:focus-visible{
  outline:2px solid var(--blue); outline-offset:2px;
}
body{
  font-family:'DM Sans',system-ui,sans-serif;
  background:var(--bg);
  color:var(--text);
  height:100dvh;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

@keyframes fu{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pk{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.85)}}
@keyframes slideIn{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
@keyframes popIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}

/* ─── HEADER ─────────────────────────────── */
header{
  background:var(--panel);
  border-bottom:1px solid var(--border);
  padding:0 20px;
  height:56px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-shrink:0;
  z-index:20;
}
.hlogo{
  display:flex;
  align-items:center;
  gap:10px;
}
.hlogo-icon{
  width:32px;height:32px;
  background:var(--grad);
  border-radius:9px;
  display:flex;align-items:center;justify-content:center;
  font-size:16px;
  box-shadow:0 0 16px rgba(124,58,237,.35);
  transition:transform .25s ease;
}
.hlogo:hover .hlogo-icon{ transform:scale(1.06) rotate(-4deg); }
.htitle{
  font-family:'Space Mono',monospace;
  font-size:15px;
  font-weight:700;
  color:var(--text);
  letter-spacing:-.3px;
}
.htitle span{color:var(--blue2)}
.bsair{
  font-size:12px;
  font-weight:600;
  background:transparent;
  border:1px solid var(--border2);
  color:var(--sub2);
  padding:6px 14px;
  border-radius:8px;
  cursor:pointer;
  transition:.2s;
  letter-spacing:.2px;
}
.bsair:hover{
  background:rgba(239,68,68,.12);
  border-color:rgba(239,68,68,.4);
  color:#f87171;
}

/* ─── APP ─────────────────────────────────── */
#app{display:flex;flex:1;overflow:hidden}

/* ─── SIDEBAR ─────────────────────────────── */
#sb{
  width:310px;
  background:var(--panel);
  border-right:1px solid var(--border);
  display:flex;
  flex-direction:column;
  flex-shrink:0;
  transition:transform .3s cubic-bezier(.4,0,.2,1);
}

/* SIDEBAR TOP — agora com o botão voltar ao index */
.sbtop{
  padding:14px 14px 10px;
  border-bottom:1px solid var(--border);
  display:flex;
  flex-direction:column;
  gap:10px;
}
.sbtop-row{
  display:flex;
  align-items:center;
  gap:10px;
}
.sb-back{
  width:32px;height:32px;
  border-radius:9px;
  background:var(--card);
  border:1px solid var(--border2);
  color:var(--sub2);
  font-size:15px;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:.2s;
  flex-shrink:0;
  line-height:1;
}
.sb-back:hover{
  background:rgba(59,130,246,.15);
  border-color:rgba(59,130,246,.4);
  color:var(--blue2);
}
.sbtit{
  font-size:13px;
  font-weight:700;
  color:var(--text);
  letter-spacing:.2px;
  flex:1;
}
.bwrap{position:relative}
.bwrap input{
  width:100%;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:12px;
  padding:9px 12px 9px 36px;
  color:var(--text);
  font-size:13px;
  outline:none;
  transition:border .2s,background .2s;
  font-family:inherit;
}
.bwrap input:focus{border-color:var(--blue);background:rgba(59,130,246,.04)}
.bwrap input::placeholder{color:var(--sub)}
.bwrap::before{
  content:"⌕";
  position:absolute;
  left:11px;top:50%;
  transform:translateY(-50%);
  font-size:15px;
  color:var(--sub);
  pointer-events:none;
}

/* TABS */
.tabs{
  display:flex;
  padding:0 10px;
  border-bottom:1px solid var(--border);
  gap:2px;
}
.tab{
  flex:1;
  padding:10px 0;
  text-align:center;
  font-size:12px;
  font-weight:600;
  color:var(--sub);
  cursor:pointer;
  border-bottom:2px solid transparent;
  transition:.2s;
  letter-spacing:.3px;
}
.tab{ border-radius:8px 8px 0 0; }
.tab:hover{ color:var(--sub2); background:rgba(255,255,255,.02); }
.tab.at{color:var(--blue2);border-image:var(--grad) 1;}

/* LISTA */
#lista{flex:1;overflow-y:auto;padding:8px}
#lista::-webkit-scrollbar{width:2px}
#lista::-webkit-scrollbar-thumb{background:#1e2a40;border-radius:2px}
.vazio{
  text-align:center;
  padding:52px 20px;
  color:var(--sub);
  font-size:13px;
  line-height:2.2;
}
.vazio .ic{font-size:32px;display:block;margin-bottom:8px;opacity:.3}
.spin{
  width:26px;height:26px;margin:0 auto 10px;
  border:2.5px solid #1c2333;border-top-color:var(--blue);
  border-radius:50%;animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

.item{
  display:flex;
  align-items:center;
  gap:11px;
  padding:10px 10px;
  border-radius:14px;
  cursor:pointer;
  transition:background .15s,border .15s;
  border:1px solid transparent;
  animation:slideIn .2s;
  margin-bottom:2px;
}
.item:hover{background:rgba(255,255,255,.03)}
.item.at{
  background:rgba(59,130,246,.08);
  border-color:rgba(59,130,246,.18);
}

.avw{position:relative;flex-shrink:0}
.av{
  width:46px;height:46px;
  border-radius:50%;
  background:linear-gradient(135deg,#1e3a5f,#0f2040);
  display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:17px;color:#fff;
  overflow:hidden;
  border:2px solid var(--border2);
  transition:border .2s;
}
.item.at .av,.item:hover .av{border-color:rgba(124,58,237,.45)}
.av img{width:100%;height:100%;object-fit:cover}
.dot{
  position:absolute;bottom:1px;right:1px;
  width:12px;height:12px;
  border-radius:50%;
  border:2.5px solid var(--panel);
}
.don{background:var(--green);animation:pk 2.5s infinite}
.doff{background:#2a3347}

.inf{flex:1;min-width:0}
.inome{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.ipre{font-size:12px;color:var(--sub);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.meta{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex-shrink:0}
.mhora{font-size:11px;color:var(--sub)}
.badge{
  background:var(--grad);
  color:#fff;
  font-size:10px;
  font-weight:700;
  border-radius:20px;
  padding:2px 7px;
  min-width:20px;
  text-align:center;
  box-shadow:0 2px 8px rgba(124,58,237,.4);
  animation:badgeIn .25s ease;
}
@keyframes badgeIn{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}

/* ─── ÁREA PRINCIPAL ──────────────────────── */
#area{
  flex:1;
  display:flex;
  flex-direction:column;
  min-width:0;
  background:var(--bg);
  position:relative;
}

/* Background pattern on empty state */
#area::before{
  content:'';
  position:absolute;inset:0;
  background-image:
    radial-gradient(circle at 20% 50%, rgba(59,130,246,.04) 0, transparent 50%),
    radial-gradient(circle at 80% 20%, rgba(16,212,142,.03) 0, transparent 40%);
  pointer-events:none;
  z-index:0;
}

#welcome{
  position:relative;z-index:1;
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:12px;
  color:var(--sub);
  font-size:14px;
}
.wl-icon{
  width:72px;height:72px;
  border-radius:50%;
  background:var(--card);
  border:1px solid var(--border2);
  display:flex;align-items:center;justify-content:center;
  font-size:30px;
  opacity:.4;
  margin-bottom:4px;
}
#welcome p{font-size:15px;font-weight:600;color:var(--sub2)}
#welcome small{font-size:12px;color:var(--sub);opacity:.7}

/* HEADER CONVERSA */
#hdrC{
  display:none;
  padding:10px 18px;
  flex-shrink:0;
  background:var(--panel);
  border-bottom:1px solid var(--border);
  align-items:center;
  gap:12px;
  position:relative;
  z-index:1;
}
#hdrC::after{
  content:'';
  position:absolute;
  bottom:-1px;left:0;right:0;
  height:1px;
  background:linear-gradient(90deg,transparent,rgba(59,130,246,.2),transparent);
}
.hcback{
  display:none;
  background:var(--card);
  border:1px solid var(--border2);
  color:var(--sub2);
  font-size:16px;
  cursor:pointer;
  padding:0;
  width:32px;height:32px;
  border-radius:9px;
  align-items:center;
  justify-content:center;
  transition:.2s;
  flex-shrink:0;
}
.hcback:hover{color:var(--blue2);border-color:rgba(59,130,246,.4)}
.hcav{
  width:38px;height:38px;
  border-radius:50%;
  background:linear-gradient(135deg,#1e3a5f,#0f2040);
  display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:14px;color:#fff;
  overflow:hidden;
  border:2px solid var(--border2);
  flex-shrink:0;
}
.hcav img{width:100%;height:100%;object-fit:cover}
.hcinfo{flex:1;min-width:0}
.hcnome{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hcst{font-size:11px;color:var(--sub);margin-top:2px;font-weight:500}
.hcst.on{color:var(--green)}
.hcst.on::before{content:'● ';font-size:8px}
.hcst::before{content:'○ ';font-size:8px}
.hcperf{
  font-size:12px;
  font-weight:600;
  background:var(--card);
  border:1px solid var(--border2);
  color:var(--sub2);
  padding:6px 12px;
  border-radius:9px;
  cursor:pointer;
  white-space:nowrap;
  transition:.2s;
}
.hcperf:hover{background:rgba(59,130,246,.12);border-color:rgba(59,130,246,.3);color:var(--blue2)}

/* MENSAGENS */
#msgs{
  flex:1;
  overflow-y:auto;
  padding:20px 20px 12px;
  display:flex;
  flex-direction:column;
  gap:2px;
  position:relative;z-index:1;
}
#msgs::-webkit-scrollbar{width:3px}
#msgs::-webkit-scrollbar-thumb{background:#1c2a40;border-radius:3px}

.ddia{
  display:flex;align-items:center;gap:10px;
  margin:16px 0 8px;
}
.ddia span{
  font-size:11px;color:var(--sub);font-weight:600;
  letter-spacing:.6px;white-space:nowrap;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:20px;
  padding:3px 12px;
  text-transform:uppercase;
}
.ddia::before,.ddia::after{content:'';flex:1;height:1px;background:var(--border)}

.mrow{
  display:flex;
  align-items:flex-end;
  gap:7px;
  animation:fu .18s;
  margin-bottom:1px;
}
.mrow.mn{flex-direction:row-reverse}

/* Avatar mini */
.mavmini{
  width:26px;height:26px;
  border-radius:50%;
  flex-shrink:0;
  background:linear-gradient(135deg,#1e3a5f,#0f2040);
  display:flex;align-items:center;justify-content:center;
  font-size:9px;font-weight:700;color:#fff;
  overflow:hidden;
  border:1px solid var(--border2);
}
.mavmini img{width:100%;height:100%;object-fit:cover}

/* Bolhas */
.bolha{
  max-width:68%;
  padding:10px 14px;
  border-radius:18px;
  font-size:14px;
  line-height:1.6;
  word-break:break-word;
  position:relative;
}
.bolha.del{
  background:var(--msg-in);
  border:1px solid var(--border2);
  border-bottom-left-radius:5px;
  color:var(--text);
}
.bolha.mn{
  background:var(--msg-out);
  border:1px solid rgba(59,130,246,.22);
  border-bottom-right-radius:5px;
  color:#c8dcf8;
}
.bolha img{
  max-width:220px;max-height:180px;
  border-radius:10px;
  display:block;margin-top:7px;
  cursor:pointer;
  transition:transform .2s,opacity .2s;
  border:1px solid rgba(255,255,255,.05);
}
.bolha img:hover{transform:scale(1.03);opacity:.92}

.mhora{font-size:10px;color:#3a4f6e;flex-shrink:0;padding-bottom:3px}
.mst{font-size:11px;flex-shrink:0;padding-bottom:3px;letter-spacing:-1px}

/* ─── INPUT AREA ──────────────────────────── */
#inpArea{
  display:none;
  padding:12px 16px calc(14px + env(safe-area-inset-bottom, 0px));
  border-top:1px solid var(--border);
  background:var(--panel);
  flex-shrink:0;
  position:relative;z-index:1;
}
#prevBar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.pvitem{position:relative}
.pvitem img{width:54px;height:54px;border-radius:9px;object-fit:cover;border:1px solid var(--border2)}
.pvrm{
  position:absolute;top:-5px;right:-5px;
  width:17px;height:17px;
  border-radius:50%;
  background:var(--blue);
  color:#fff;
  font-size:9px;
  font-weight:700;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
  border:1.5px solid var(--panel);
}
.inpwrap{
  display:flex;
  align-items:flex-end;
  gap:10px;
  background:var(--card);
  border:1px solid var(--border2);
  border-radius:18px;
  padding:10px 12px;
  transition:border .2s,box-shadow .2s;
}
.inpwrap:focus-within{
  border-color:rgba(59,130,246,.5);
  box-shadow:0 0 0 3px rgba(59,130,246,.08);
}
.bfoto{
  background:none;border:none;
  color:var(--sub);font-size:18px;
  cursor:pointer;padding:0;
  flex-shrink:0;transition:color .2s;line-height:1;
}
.bfoto:hover{color:var(--blue2)}
#txMsg{
  flex:1;
  background:transparent;border:none;outline:none;
  color:var(--text);
  font-family:inherit;font-size:14px;
  resize:none;max-height:120px;min-height:22px;
  line-height:1.55;overflow-y:auto;
}
#txMsg::placeholder{color:var(--sub)}
#benv{
  width:38px;height:38px;
  border-radius:50%;border:none;
  background:var(--grad);
  color:#fff;font-size:14px;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
  transition:opacity .2s,transform .15s,box-shadow .2s;
  box-shadow:0 4px 14px rgba(124,58,237,.4);
}
#benv:hover{opacity:.95;transform:scale(1.08) rotate(8deg);box-shadow:0 6px 20px rgba(124,58,237,.5)}
#benv:active{transform:scale(0.94)}
#benv:disabled{opacity:.3;cursor:not-allowed;transform:none;box-shadow:none}

/* ─── VIEWER ──────────────────────────────── */
#viewer{
  position:fixed;inset:0;
  background:rgba(0,0,0,.88);
  backdrop-filter:blur(8px);
  display:none;align-items:center;justify-content:center;
  z-index:999;
}
#viewer img{max-width:95%;max-height:92%;border-radius:12px;animation:popIn .2s}
#vcls{
  position:absolute;top:20px;right:20px;
  background:rgba(255,255,255,.1);
  border:1px solid rgba(255,255,255,.15);
  color:#fff;font-size:14px;
  padding:8px 14px;border-radius:10px;cursor:pointer;
  transition:.2s;backdrop-filter:blur(6px);
}
#vcls:hover{background:rgba(255,255,255,.18)}

/* ─── TOAST ───────────────────────────────── */
#toast{
  position:fixed;bottom:82px;left:50%;
  transform:translateX(-50%) translateY(14px);
  background:var(--card);
  border:1px solid var(--border2);
  border-radius:24px;
  padding:9px 20px;
  font-size:13px;
  font-weight:500;
  color:var(--green2);
  opacity:0;pointer-events:none;z-index:9999;
  transition:opacity .3s,transform .3s;
  white-space:nowrap;
  box-shadow:0 8px 24px rgba(0,0,0,.4);
  max-width:88vw;overflow:hidden;text-overflow:ellipsis;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.err{color:#f87171;border-color:rgba(248,113,113,.3)}

/* ─── TAB BAR ─────────────────────────────── */
#tabBar{
  height:62px;
  flex-shrink:0;
  background:var(--panel);
  border-top:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-around;
  z-index:90;
  padding-bottom:env(safe-area-inset-bottom,0px);
}
.tab-item{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px;
  cursor:pointer;
  padding:8px 14px;
  border-radius:14px;
  transition:.2s;
  flex:1;
  position:relative;
}
.tab-item:active{transform:scale(.88)}
.tab-icon-svg{color:var(--sub);transition:color .2s,transform .2s ease}
.tab-label{font-size:10px;color:var(--sub);letter-spacing:.2px;font-weight:500;transition:color .2s}
.tab-item.active{background:rgba(59,130,246,.08)}
.tab-item.active .tab-icon-svg{color:var(--blue2);transform:scale(1.12)}
.tab-item.active .tab-label{color:var(--blue2)}
.tab-item.active::after{
  content:'';
  position:absolute;bottom:3px;
  width:4px;height:4px;
  border-radius:50%;
  background:var(--blue2);
}

/* ─── MOBILE ──────────────────────────────── */
@media(max-width:600px){
  #sb{position:fixed;top:56px;left:0;right:0;bottom:62px;width:100%;z-index:50}
  #sb.hide{transform:translateX(-100%)}
  .hcback{display:flex!important}
}
</style>
</head>
<body>

<header>
  <div class="hlogo">
    <div class="hlogo-icon">💬</div>
    <span class="htitle">Evo<span>Chat</span></span>
  </div>
  <button class="bsair" onclick="logout()">Sair</button>
</header>

<div id="app">
  <!-- SIDEBAR -->
  <div id="sb">
    <div class="sbtop">
      <div class="sbtop-row">
        <!-- BOTÃO VOLTAR AO INDEX AGORA FICA AQUI, NA ÁREA DE CONTATOS -->
        <button class="sb-back" onclick="location.href='index.html'" title="Voltar ao início">←</button>
        <div class="sbtit">Mensagens</div>
      </div>
      <div class="bwrap">
        <input type="text" id="txBusca" placeholder="Buscar contato..." oninput="renderLista()">
      </div>
    </div>
    <div class="tabs">
      <div class="tab at" data-tab="todos" onclick="trocarTab(this)">Todos</div>
      <div class="tab" data-tab="online" onclick="trocarTab(this)">Online</div>
    </div>
    <div id="lista"><div class="vazio"><div class="spin"></div>Carregando...</div></div>
  </div>

  <!-- ÁREA PRINCIPAL -->
  <div id="area">
    <div id="welcome">
      <div class="wl-icon">💬</div>
      <p>Selecione uma conversa</p>
      <small>Apenas quem segue e é seguido de volta aparece aqui</small>
    </div>
    <div id="hdrC">
      <button class="hcback" onclick="voltarLista()">←</button>
      <div class="hcav" id="hcAv"></div>
      <div class="hcinfo">
        <div class="hcnome" id="hcNome"></div>
        <div class="hcst" id="hcSt"></div>
      </div>
      <button class="hcperf" id="hcPerf">👤 Perfil</button>
    </div>
    <div id="msgs"></div>
    <div id="inpArea">
      <div id="prevBar"></div>
      <div class="inpwrap">
        <button class="bfoto" onclick="document.getElementById('inFoto').click()">📷</button>
        <textarea id="txMsg" rows="1" placeholder="Mensagem..."></textarea>
        <button id="benv" onclick="enviar()">➤</button>
      </div>
      <input type="file" id="inFoto" accept="image/*" multiple style="display:none" onchange="selFotos(event)">
    </div>
  </div>
</div>

<div id="viewer" onclick="fViewer()">
  <button id="vcls" onclick="fViewer()">✕ Fechar</button>
  <img id="viewerImg" src="" alt="">
</div>
<div id="toast"></div>

<nav id="tabBar">
  <div class="tab-item" onclick="location.href='index.html'">
    <svg class="tab-icon-svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    <span class="tab-label">Feed</span>
  </div>
  <div class="tab-item active">
    <svg class="tab-icon-svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
    <span class="tab-label">Chat</span>
  </div>
  <div class="tab-item" onclick="location.href='veez.html'">
    <svg class="tab-icon-svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22V12"/><path d="M12 12C12 7 8 6 5 6c0 5 3 6.5 7 6z"/><path d="M12 12c0-4.5 3.5-6 7-6 0 5-3 6.5-7 6z"/></svg>
    <span class="tab-label">Planta</span>
  </div>
  <div class="tab-item" onclick="localStorage.setItem('perfil',user);location.href='user.html'">
    <svg class="tab-icon-svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    <span class="tab-label">Perfil</span>
  </div>
</nav>

<script>
/* ═══ FIREBASE ═══ */
firebase.initializeApp({ databaseURL:"https://contaevilution-default-rtdb.firebaseio.com/" });
const db = firebase.database();

const chatDB = firebase.initializeApp(
  { databaseURL:"https://backupecoin-default-rtdb.firebaseio.com/" }, "chatDB"
).database();

/* ═══ USUÁRIO ═══ */
function gCookie(n){const m=document.cookie.match(new RegExp('(^| )'+n+'=([^;]+)'));return m?m[2]:null}
const user = localStorage.getItem("user")||sessionStorage.getItem("user")||gCookie("user");
if(!user) location.replace("login.html");

function logout(){
  localStorage.removeItem("user"); sessionStorage.removeItem("user");
  document.cookie="user=;expires=Thu, 01 Jan 1970 00:00:00 UTC;path=/;";
  location.href="login.html";
}

/* ═══ ROT-20 ═══ */
function rot20(s){return s.replace(/[a-zA-Z]/g,c=>{const b=c<='Z'?65:97;return String.fromCharCode(((c.charCodeAt(0)-b+20)%26)+b)})}
function drot20(s){return s.replace(/[a-zA-Z]/g,c=>{const b=c<='Z'?65:97;return String.fromCharCode(((c.charCodeAt(0)-b+6)%26)+b)})}

/* ═══ HELPERS ═══ */
function cKey(a,b){return[a,b].sort().join("_")}
function hStr(ts){if(!ts)return"";const d=new Date(ts),n=new Date();if(n-d<86400000)return d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});return d.toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"})}
function dDia(ts){const d=new Date(ts),n=new Date();if(d.toDateString()===n.toDateString())return"Hoje";const o=new Date(n);o.setDate(o.getDate()-1);if(d.toDateString()===o.toDateString())return"Ontem";return d.toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit",year:"2-digit"})}
function avHTML(foto,nome,sz){if(foto)return`<img src="${foto}" style="width:${sz}px;height:${sz}px;object-fit:cover;border-radius:50%;">`;return`<span style="font-size:${Math.round(sz*.38)}px;font-weight:700;color:#fff;">${(nome||"?").charAt(0).toUpperCase()}</span>`}
function esc(s){return(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function toast(msg,ms=2400){const el=document.getElementById("toast");el.textContent=msg;el.classList.toggle("err",msg.startsWith("❌"));el.classList.add("show");clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove("show"),ms)}

/* ═══ ESTADO ═══ */
let contatos=[],tabAtual="todos",ativo=null,offMsgs=null,imgsPend=[],fCache={};

function getFoto(nome){
  if(fCache[nome]!==undefined)return Promise.resolve(fCache[nome]);
  return db.ref("fotosPerfil/"+nome).once("value").then(s=>{fCache[nome]=s.val()||null;return fCache[nome]});
}

/* ═══ CARREGAR CONTATOS ═══ */
async function carregarContatos(){
  try{
    const sn = await db.ref("seguindo/"+user).once("value");
    const queSigo = sn.exists() ? Object.keys(sn.val()) : [];
    const mutuos = new Set();
    for(const outro of queSigo){
      const s = await db.ref("seguidores/"+outro+"/"+user).once("value");
      if(s.exists()) mutuos.add(outro);
    }
    const sh = await db.ref("chatContatos/"+user).once("value");
    if(sh.exists()) Object.keys(sh.val()).forEach(c=>mutuos.add(c));
    const lista = Array.from(mutuos);
    if(!lista.length){
      document.getElementById("lista").innerHTML=
        `<div class="vazio"><span class="ic">😶</span>Nenhum contato ainda<br><small style="color:#555;font-size:11px;">Siga alguém e peça para te seguir de volta</small></div>`;
      return;
    }
    contatos = lista.map(nome=>({nome,foto:null,online:false,ultimaMsg:null,naoLidas:0}));
    renderLista();
    for(const c of contatos){
      getFoto(c.nome).then(f=>{c.foto=f;renderLista()});
      db.ref("usuarios/"+c.nome+"/online").on("value",s=>{
        c.online=s.val()===true;
        if(ativo===c.nome) atualizarSt(c);
        renderLista();
      });
      const key=cKey(user,c.nome);
      chatDB.ref("chats/"+key+"/msgs").orderByChild("ts").limitToLast(1).on("child_added",s=>{
        const m=s.val();
        const txt=m.texto?drot20(m.texto):"";
        c.ultimaMsg={preview:m.imgUrl?"📷 Imagem":(txt.slice(0,40)+(txt.length>40?"…":"")),hora:hStr(m.ts),ts:m.ts||0};
        if(ativo!==c.nome&&m.de!==user) c.naoLidas=(c.naoLidas||0)+1;
        renderLista();
      });
    }
  }catch(e){
    console.error("carregarContatos:",e);
    document.getElementById("lista").innerHTML=
      `<div class="vazio"><span class="ic">❌</span>Erro ao carregar<br><small style="color:#555;font-size:11px;">${esc(e.message||String(e))}</small><br>
       <button onclick="location.reload()" style="margin-top:10px;padding:6px 16px;border-radius:8px;border:none;background:#3b82f6;color:#fff;cursor:pointer;font-size:12px;font-family:inherit;">Tentar novamente</button></div>`;
  }
}

/* ═══ RENDER LISTA ═══ */
function renderLista(){
  const q=(document.getElementById("txBusca").value||"").toLowerCase();
  let lista=contatos.filter(c=>{
    if(q&&!c.nome.toLowerCase().includes(q))return false;
    if(tabAtual==="online"&&!c.online)return false;
    return true;
  });
  lista.sort((a,b)=>(b.ultimaMsg?.ts||0)-(a.ultimaMsg?.ts||0));
  const el=document.getElementById("lista");
  if(!lista.length){el.innerHTML=`<div class="vazio"><span class="ic">🔍</span>Nenhum resultado</div>`;return}
  el.innerHTML="";
  lista.forEach(c=>{
    const d=document.createElement("div");
    d.className="item"+(ativo===c.nome?" at":"");
    d.innerHTML=`
      <div class="avw">
        <div class="av">${avHTML(c.foto,c.nome,46)}</div>
        <div class="dot ${c.online?"don":"doff"}"></div>
      </div>
      <div class="inf">
        <div class="inome">@${esc(c.nome)}</div>
        <div class="ipre">${c.ultimaMsg?esc(c.ultimaMsg.preview):"Iniciar conversa..."}</div>
      </div>
      <div class="meta">
        <div class="mhora">${c.ultimaMsg?c.ultimaMsg.hora:""}</div>
        ${c.naoLidas?`<div class="badge">${c.naoLidas}</div>`:""}
      </div>`;
    d.onclick=()=>abrirConv(c);
    el.appendChild(d);
  });
}

function trocarTab(el){
  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("at"));
  el.classList.add("at"); tabAtual=el.dataset.tab; renderLista();
}

/* ═══ ABRIR CONVERSA ═══ */
function abrirConv(c){
  ativo=c.nome; c.naoLidas=0;
  document.getElementById("sb").classList.add("hide");
  document.getElementById("hdrC").style.display="flex";
  document.getElementById("hcAv").innerHTML=avHTML(c.foto,c.nome,38);
  document.getElementById("hcNome").textContent="@"+c.nome;
  atualizarSt(c);
  document.getElementById("hcPerf").onclick=()=>{localStorage.setItem("perfil",c.nome);location.href="user.html"};
  document.getElementById("welcome").style.display="none";
  document.getElementById("inpArea").style.display="block";
  document.getElementById("msgs").innerHTML="";
  imgsPend=[]; renderPrev();
  if(offMsgs)offMsgs();
  escutarMsgs(c.nome);
  renderLista();
  // Auto-dismiss badge ao abrir conversa
  c.naoLidas = 0;
  renderLista();
}

function atualizarSt(c){
  const el=document.getElementById("hcSt"); if(!el)return;
  el.textContent=c.online?"Online":"Offline";
  el.className="hcst"+(c.online?" on":"");
}

function voltarLista(){
  document.getElementById("sb").classList.remove("hide");
  document.getElementById("hdrC").style.display="none";
  document.getElementById("inpArea").style.display="none";
  document.getElementById("welcome").style.display="flex";
  document.getElementById("msgs").innerHTML="";
  if(offMsgs){offMsgs();offMsgs=null}
  ativo=null; renderLista();
}

/* ═══ ESCUTAR MENSAGENS ═══ */
function escutarMsgs(contato){
  const key=cKey(user,contato);
  const ref=chatDB.ref("chats/"+key+"/msgs").orderByChild("ts");
  ref.once("value").then(snap=>{
    if(ativo!==contato)return;
    const box=document.getElementById("msgs"); box.innerHTML="";
    if(!snap.exists()){marcarLidas(contato);return}
    let ultDia="";
    snap.forEach(child=>{
      const m=child.val();
      const dia=dDia(m.ts||Date.now());
      if(dia!==ultDia){
        const d=document.createElement("div"); d.className="ddia";
        d.innerHTML=`<span>${dia}</span>`; box.appendChild(d); ultDia=dia;
      }
      renderMsg(m,child.key,false);
    });
    box.scrollTop=box.scrollHeight;
    marcarLidas(contato);
  }).catch(e=>{console.error(e);toast("❌ Erro ao carregar mensagens")});
  const ts0=Date.now();
  const fnA=ref.on("child_added",snap=>{
    const m=snap.val();
    if(m.ts&&m.ts<ts0)return;
    if(ativo!==contato)return;
    if(!document.getElementById("msg-"+snap.key)){
      renderMsg(m,snap.key,true);
      if(m.de!==user) chatDB.ref("chats/"+key+"/msgs/"+snap.key+"/lida").set(true);
    }
  });
  const fnC=ref.on("child_changed",snap=>{
    if(ativo!==contato)return;
    const m=snap.val();
    if(m.de===user) atualizarVisto(snap.key,m.lida===true);
  });
  offMsgs=()=>{ref.off("child_added",fnA);ref.off("child_changed",fnC)};
}

/* ═══ RENDER MSG ═══ */
function renderMsg(m,key,scroll){
  const box=document.getElementById("msgs");
  if(!box||document.getElementById("msg-"+key))return;
  const minha=m.de===user;
  const txt=m.texto?drot20(m.texto):"";
  const row=document.createElement("div");
  row.className="mrow"+(minha?" mn":""); row.id="msg-"+key;
  let cont="";
  if(txt)cont+=`<div>${esc(txt)}</div>`;
  if(m.imgUrl){const us=Array.isArray(m.imgUrl)?m.imgUrl:[m.imgUrl];us.forEach(u=>{cont+=`<img src="${esc(u)}" onclick="aViewer('${esc(u)}')" loading="lazy">`})}
  const mini=!minha?`<div class="mavmini">${avHTML(fCache[m.de]||null,m.de,26)}</div>`:"";
  const visto=minha?`<span class="mst" style="color:${m.lida?"#3b82f6":"#3a4f6e"};">${m.lida?"✓✓":"✓"}</span>`:"";
  row.innerHTML=`${mini}<div class="bolha ${minha?"mn":"del"}">${cont}</div>${visto}<div class="mhora">${hStr(m.ts)}</div>`;
  box.appendChild(row);
  if(scroll)box.scrollTop=box.scrollHeight;
}

function atualizarVisto(key,lida){
  const row=document.getElementById("msg-"+key); if(!row)return;
  const el=row.querySelector(".mst"); if(el){el.textContent=lida?"✓✓":"✓";el.style.color=lida?"#3b82f6":"#3a4f6e"}
}

function marcarLidas(contato){
  const key=cKey(user,contato);
  chatDB.ref("chats/"+key+"/msgs").orderByChild("ts").once("value").then(snap=>{
    if(!snap.exists())return;
    const u={}; snap.forEach(c=>{const m=c.val();if(m.de!==user&&!m.lida)u["chats/"+key+"/msgs/"+c.key+"/lida"]=true});
    if(Object.keys(u).length)chatDB.ref().update(u);
  }).catch(()=>{});
}

/* ═══ VERIFICAR BLOQUEIO NO CHAT ═══ */
async function verificarBloqueioChat(destinatario) {
  const userKey = user.replace(/[.#$[\]]/g, '_');
  const destKey = destinatario.replace(/[.#$[\]]/g, '_');
  // Verifica se o destinatário bloqueou o usuário logado
  const snap = await db.ref("bloqueados/" + destKey + "/" + userKey).once("value");
  return snap.exists();
}

/* ═══ ENVIAR ═══ */
async function enviar(){
  if(!ativo)return;
  const ta=document.getElementById("txMsg");
  const texto=ta?ta.value.trim():"";
  if(!texto&&!imgsPend.length)return;
  const btn=document.getElementById("benv"); btn.disabled=true;

  // Verificar bloqueio antes de enviar
  try {
    const bloqueado = await verificarBloqueioChat(ativo);
    if (bloqueado) {
      toast("❌ Você foi bloqueado por este usuário.");
      btn.disabled=false;
      return;
    }
  } catch(e) { /* ignora erro de verificação */ }

  const key=cKey(user,ativo);
  const msg={de:user,ts:Date.now(),...(texto?{texto:rot20(texto)}:{}),...(imgsPend.length?{imgUrl:imgsPend.length===1?imgsPend[0].dataUrl:imgsPend.map(p=>p.dataUrl)}:{})};
  try{
    await chatDB.ref("chats/"+key+"/msgs").push(msg);
    db.ref("chatContatos/"+user+"/"+ativo).set(true);
    db.ref("chatContatos/"+ativo+"/"+user).set(true);
    if(ta){ta.value="";ta.style.height="auto"} imgsPend=[]; renderPrev();
  }catch(e){console.error(e);toast("❌ "+(e.message||e).slice(0,60))}
  btn.disabled=false;
}

/* ═══ IMAGENS ═══ */
function compImg(file){return new Promise(res=>{const img=new Image(),r=new FileReader();r.onload=e=>img.src=e.target.result;img.onload=()=>{const c=document.createElement("canvas"),max=900,sc=Math.min(max/img.width,max/img.height,1);c.width=img.width*sc;c.height=img.height*sc;c.getContext("2d").drawImage(img,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",.55))};r.readAsDataURL(file)})}
function selFotos(e){Array.from(e.target.files).forEach(f=>{if(!f.type.startsWith("image/"))return;compImg(f).then(d=>{imgsPend.push({dataUrl:d});renderPrev()})});e.target.value=""}
function renderPrev(){const b=document.getElementById("prevBar");if(!imgsPend.length){b.innerHTML="";return}b.innerHTML=imgsPend.map((p,i)=>`<div class="pvitem"><img src="${p.dataUrl}"><div class="pvrm" onclick="rmImg(${i})">✕</div></div>`).join("")}
function rmImg(i){imgsPend.splice(i,1);renderPrev()}

/* ═══ VIEWER ═══ */
function aViewer(src){document.getElementById("viewerImg").src=src;document.getElementById("viewer").style.display="flex"}
function fViewer(){document.getElementById("viewer").style.display="none";document.getElementById("viewerImg").src=""}

/* ═══ ONLINE ═══ */
function setOnline(){const r=db.ref("usuarios/"+user+"/online");r.set(true);r.onDisconnect().set(false)}

/* ═══ EVENTS ═══ */
document.getElementById("txMsg").addEventListener("input",function(){this.style.height="auto";this.style.height=Math.min(this.scrollHeight,120)+"px"});
document.getElementById("txMsg").addEventListener("keydown",function(e){if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();enviar()}});

/* ═══ INIT ═══ */
setOnline();
carregarContatos();
</script>
</body>
</html>
