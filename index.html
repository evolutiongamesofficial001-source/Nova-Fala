<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nova-Fala</title>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<link rel="stylesheet" href="index.css">
</head>

<body>

<header>
    <div style="display:flex;align-items:center;gap:10px;">
        <div onclick="abrirMenu()" style="cursor:pointer;font-size:22px;">☰</div>
        <span class="nova-fala-logo">Nova-Fala</span>
    </div>
    
    <div style="display:flex;align-items:center;gap:8px;">
        <div onclick="abrirBusca()" style="cursor:pointer;font-size:20px;" title="Buscar usuários">🔍</div>
        <!-- BOTÃO NOTIFICAÇÃO -->
        <div id="notifBtn" onclick="toggleNotificacoes()" style="cursor:pointer;font-size:20px;position:relative;" title="Notificações">
            🔔
            <span id="notifBadge" style="display:none;position:absolute;top:-4px;right:-4px;background:#ff6b81;color:white;font-size:10px;font-weight:bold;border-radius:50%;width:16px;height:16px;display:none;align-items:center;justify-content:center;line-height:1;">0</span>
        </div>
    </div>
</header>

<!-- ================= PAINEL NOTIFICAÇÕES ================= -->
<div id="notifOverlay" onclick="fecharNotificacoes()" style="display:none;position:fixed;inset:0;background:#0009;z-index:500;"></div>
<div id="notifPanel" style="display:none;position:fixed;top:56px;right:8px;width:320px;max-width:95vw;background:#111;border:1px solid #222;border-radius:14px;z-index:501;animation:fade .2s;overflow:hidden;">
    <div style="display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid #1f1f1f;">
        <span style="font-weight:bold;font-size:15px;color:#e8e8e8;">🔔 Notificações</span>
        <div style="display:flex;gap:10px;align-items:center;">
            <span onclick="marcarTodasLidas()" style="cursor:pointer;font-size:11px;color:#1da1f2;">Marcar lidas</span>
            <span onclick="fecharNotificacoes()" style="cursor:pointer;color:#888;font-size:18px;">✕</span>
        </div>
    </div>
    <div id="notifLista" style="max-height:380px;overflow-y:auto;"></div>
</div>

<!-- ================= BUSCA ================= -->
<div id="buscaOverlay" onclick="fecharBusca()" style="display:none;position:fixed;inset:0;background:#0009;z-index:500;"></div>
<div id="buscaBox" style="display:none;position:fixed;top:60px;left:50%;transform:translateX(-50%);width:90%;max-width:400px;background:#111;border:1px solid #222;border-radius:14px;padding:16px;z-index:501;animation:fade .2s;">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;">
        <span style="font-size:18px;">🔍</span>
        <input id="buscaInput" type="text" placeholder="Buscar usuário..." oninput="buscarUsuarios(this.value)"
            style="flex:1;background:#0c0c0c;border:1px solid #333;border-radius:8px;padding:9px 12px;color:white;font-size:14px;outline:none;">
        <span onclick="fecharBusca()" style="cursor:pointer;color:#888;font-size:18px;line-height:1;">✕</span>
    </div>
    <div id="buscaResultados" style="max-height:300px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;">
        <div style="color:#555;font-size:13px;text-align:center;">Digite para buscar...</div>
    </div>
</div>

<div id="feedLoading" style="display:none;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;gap:14px;">
    <div class="feed-spinner"></div>
    <div style="font-size:13px;color:#666;letter-spacing:0.3px;">Carregando posts...</div>
</div>

<div id="feed"></div>

<div id="plus" onclick="abrirPost()">+</div>

<div class="overlay" id="overlay" onclick="fecharPost()"></div>

<!-- ================= POPUP POST ================= -->
<div id="postPopup">

    <textarea id="postText" placeholder="O que está acontecendo?" maxlength="1000"></textarea>

    <!-- ================= ENQUETE ================= -->
    <div id="pollBox" style="margin-top:10px;">
        <button onclick="togglePoll()">📊 Criar enquete</button>

        <!-- opções -->
        <div id="pollOptions" style="display:none;margin-top:10px;">
            <input type="text" class="pollInput" placeholder="Opção 1">
            <input type="text" class="pollInput" placeholder="Opção 2">
            <input type="text" class="pollInput" placeholder="Opção 3">
            <input type="text" class="pollInput" placeholder="Opção 4">
            <input type="text" class="pollInput" placeholder="Opção 5">
        </div>

        <!-- tempo -->
        <div id="pollTimeBox" style="margin-top:8px;display:none;">
            <select id="pollTime">
                <option value="3600000">1 hora</option>
                <option value="21600000">6 horas</option>
                <option value="86400000" selected>24 horas</option>
                <option value="259200000">3 dias</option>
                <option value="604800000">7 dias</option>
            </select>
        </div>
    </div>
    <!-- ================= FIM ENQUETE ================= -->

    <!-- upload -->
    <label class="uploadBox">
        <input type="file" id="fotoInput" accept="image/*" hidden>
        <div id="uploadVisual">📷 Escolher foto</div>
    </label>

    <!-- SPOILER TOGGLE -->
    <label id="spoilerLabel" style="display:none;align-items:center;gap:8px;margin-top:10px;cursor:pointer;user-select:none;">
        <input type="checkbox" id="spoilerCheck" style="width:16px;height:16px;accent-color:#1da1f2;cursor:pointer;">
        <span style="font-size:13px;color:#aaa;">🙈 Marcar foto como <b style="color:#f59e0b;">spoiler</b></span>
    </label>

    <img id="previewImg" style="display:none;">

    <div class="counter" id="contador">0 / 1000</div>

    <div class="popupBtns">
        <button class="postBtn" onclick="postar()">Postar</button>
        <button class="cancelBtn" onclick="fecharPost()">Cancelar</button>
    </div>
</div>
<!-- ================= FIM POPUP ================= -->

<!-- ================= VIEWER ================= -->
<div id="viewer">
    <button id="closeViewer" onclick="fecharImagem()">✕</button>
    <img id="viewerImg">
</div>

<!-- ================= CONFIRM ================= -->
<div id="customConfirm">
    <div class="confirmBox">
        <div class="confirmText" id="confirmText"></div>
        <div class="confirmBtns">
            <button onclick="fecharConfirm(false)">Cancelar</button>
            <button onclick="fecharConfirm(true)" class="okBtn">OK</button>
        </div>
    </div>
</div>

<!-- ================= PROMPT ================= -->
<div id="customPrompt">
    <div class="confirmBox">
        <div class="confirmText" id="promptText"></div>
        <textarea id="promptInput" placeholder="Digite aqui..."></textarea>
        <div class="confirmBtns">
            <button onclick="fecharPrompt(null)">Cancelar</button>
            <button onclick="fecharPrompt(document.getElementById('promptInput').value)" class="okBtn">OK</button>
        </div>
    </div>
</div>

<!-- ================= MENU ================= -->
<div id="menuOverlay" onclick="fecharMenu()"></div>

<div id="menuLateral">
    <div class="menuHeader">
        Menu
        <span onclick="fecharMenu()">✕</span>
    </div>

    <button onclick="abrirConfig()">⚙️ Configurações</button>
    <button onclick="abrirMeuPerfil()">👤 Meu Perfil</button>
    <button onclick="abrirSAR()">🤖 S.A.R</button>
     <button onclick="abrirverificar()">Vereficação</button>
    <!-- BOTÃO SAIR MOVIDO PARA A BARRA LATERAL -->
    <div style="flex:1;"></div>
    <button class="menu-logout-btn" onclick="logout()">🚪 Sair da conta</button>
</div>

<!-- ================= CONFIG ================= -->
<div id="configOverlay" onclick="fecharConfig()"></div>

<div id="configBox">
    <div class="menuHeader">
        Configurações
        <span onclick="fecharConfig()">✕</span>
    </div>

    <b>Tema</b>
    <div class="temaOpcoes">
        <button id="btnEscuro" onclick="setTema('escuro')">🌙 Escuro</button>
        <button id="btnClaro" onclick="setTema('claro')">☀️ Claro</button>
    </div>
</div>

<!-- ================= TAB BAR ================= -->
<nav id="tabBar">
    <div class="tab-item active" id="tab-feed" onclick="irParaFeed()">
        <span class="tab-icon">🏠</span>
        <span class="tab-label">Feed</span>
    </div>
    <div class="tab-item" id="tab-chat" onclick="abrirchat()">
        <span class="tab-icon">💬</span>
        <span class="tab-label">Chat</span>
    </div>
    <div class="tab-item" id="tab-veez" onclick="irParaVeez()">
        <span class="tab-icon">🐇</span>
        <span class="tab-label">Rapidoz</span>
    </div>
    <div class="tab-item" id="tab-perfil" onclick="abrirMeuPerfil()">
        <span class="tab-icon">👤</span>
        <span class="tab-label">Perfil</span>
    </div>
</nav>

<script src="index.js"></script>
<script>
// ================= TAB BAR HELPERS =================
function irParaFeed() {
    setTabAtiva('tab-feed');
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function irParaVeez() {
    setTabAtiva('tab-veez');
    window.location.href = 'veez.html';
}

function setTabAtiva(id) {
    document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
    const el = document.getElementById(id);
    if (el) el.classList.add('active');
}

// Marca aba correta ao carregar
document.addEventListener('DOMContentLoaded', () => {
    setTabAtiva('tab-feed');
});
</script>

</body>
</html>
