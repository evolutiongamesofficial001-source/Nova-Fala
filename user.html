<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Perfil</title>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<style>
body{
    margin:0;
    font-family:system-ui;
    background:#0b0b0b;
    color:#e8e8e8;
    padding-bottom: 70px;
}

header{
    padding:14px;
    border-bottom:1px solid #222;
    font-size:18px;
    font-weight:bold;
    display:flex;
    align-items:center;
    gap:10px;
}

#perfil{
    padding:20px;
    text-align:center;
}

.avatar{
    width:90px;
    height:90px;
    border-radius:50%;
    background:#1da1f2;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:30px;
    margin:auto;
    overflow:hidden;
    cursor:pointer;
}

.avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

/* Nome + badge na linha */
.nome-linha{
    margin-top:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    flex-wrap:wrap;
}

.nome{
    font-size:20px;
    font-weight:bold;
}

/* Badge verificado SVG */
.badge-verificado svg{
    width:20px;
    height:20px;
    display:block;
}

/* ===== STATS CLICÁVEIS ===== */
.stats{
    margin-top:12px;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:8px;
}

.stat-item{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:2px;
    cursor:pointer;
    padding:10px 18px 10px;
    border-radius:16px;
    border:1px solid #252525;
    background:#141414;
    transition:background 0.18s, border-color 0.18s, transform 0.13s;
    -webkit-tap-highlight-color:transparent;
    min-width:96px;
    position:relative;
}

.stat-item:hover{
    border-color:#1da1f2;
    background:#181818;
}

.stat-item:active{
    transform:scale(0.91);
    background:rgba(29,161,242,0.1);
    border-color:#1da1f2;
}

.stat-num{
    font-size:19px;
    font-weight:700;
    color:#e8e8e8;
    line-height:1;
}

.stat-label{
    font-size:11px;
    color:#777;
    letter-spacing:0.3px;
}

.stat-item::after{
    content:"›";
    position:absolute;
    bottom:6px;
    right:9px;
    font-size:13px;
    color:#1da1f2;
    opacity:0.65;
    line-height:1;
    transition:opacity 0.2s;
}

.stat-item:hover::after{ opacity:1; }

.stat-dot{
    color:#2a2a2a;
    font-size:22px;
}

button{
    margin-top:14px;
    padding:10px 16px;
    border:none;
    border-radius:20px;
    background:#1da1f2;
    color:white;
    cursor:pointer;
    font-weight:bold;
}

button.seguindo{
    background:#2ee6a6;
    color:#000;
}

#posts{ padding:10px; }

.post{
    background:#121212;
    border:1px solid #1f1f1f;
    border-radius:12px;
    padding:10px;
    margin-bottom:10px;
    word-break:break-word;
    overflow-wrap:anywhere;
    white-space:pre-wrap;
}

.post a{ color:#4da6ff; text-decoration:none; }
.post a:hover{ text-decoration:underline; }

.post img{
    width:100%;
    border-radius:10px;
    margin-top:8px;
}

/* ===== MODAL BALÃO ===== */

#modalOverlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.72);
    display:none;
    z-index:500;
    backdrop-filter:blur(5px);
    -webkit-backdrop-filter:blur(5px);
    animation:fadeIn 0.2s ease;
}

#modalBalao{
    position:fixed;
    bottom:-100%;
    left:0;
    right:0;
    background:linear-gradient(180deg,#181818 0%,#111 100%);
    border-top:1px solid #2a2a2a;
    border-radius:24px 24px 0 0;
    z-index:501;
    transition:bottom 0.38s cubic-bezier(0.34,1.45,0.64,1);
    max-height:78vh;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    box-shadow:0 -10px 50px rgba(0,0,0,0.7);
}

#modalBalao.aberto{ bottom:0; }

.modal-handle{
    width:44px;
    height:4px;
    background:#2e2e2e;
    border-radius:4px;
    margin:13px auto 0;
    flex-shrink:0;
}

.modal-titulo{
    font-size:16px;
    font-weight:700;
    text-align:center;
    padding:14px 20px 12px;
    color:#e8e8e8;
    border-bottom:1px solid #1f1f1f;
    flex-shrink:0;
}

.modal-lista{
    overflow-y:auto;
    flex:1;
    padding:6px 0 28px;
}

.modal-lista::-webkit-scrollbar{ width:3px; }
.modal-lista::-webkit-scrollbar-thumb{ background:#2a2a2a; border-radius:3px; }

.modal-user-item{
    display:flex;
    align-items:center;
    gap:13px;
    padding:13px 20px;
    cursor:pointer;
    transition:background 0.15s;
    -webkit-tap-highlight-color:transparent;
}

.modal-user-item:active{ background:rgba(255,255,255,0.05); }
.modal-user-item:hover{ background:#1a1a1a; }

.modal-avatar{
    width:48px;
    height:48px;
    border-radius:50%;
    background:linear-gradient(135deg,#1da1f2,#0d8ddb);
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:700;
    font-size:19px;
    color:white;
    flex-shrink:0;
    overflow:hidden;
    border:2px solid #222;
}

.modal-avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.modal-user-info{
    flex:1;
    min-width:0;
}

/* Nome + badge dentro do modal */
.modal-nome-linha{
    display:flex;
    align-items:center;
    gap:5px;
}

.modal-user-nome{
    font-size:15px;
    font-weight:600;
    color:#e8e8e8;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.modal-badge svg{
    width:16px;
    height:16px;
    display:block;
    flex-shrink:0;
}

.modal-user-bio{
    font-size:12px;
    color:#666;
    margin-top:3px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.modal-vazio{
    text-align:center;
    color:#555;
    padding:50px 20px;
    font-size:14px;
}

.modal-loading{
    text-align:center;
    color:#555;
    padding:50px 20px;
    font-size:14px;
}

/* ===== BOTÃO LÁPIS PERSONALIZAR ===== */
.btn-personalizar{
    position:absolute;
    top:12px;
    right:14px;
    width:34px;
    height:34px;
    border-radius:50%;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.15);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:all 0.2s;
    color:white;
    font-size:15px;
    backdrop-filter:blur(6px);
}
.btn-personalizar:hover{
    background:rgba(255,255,255,0.16);
    transform:scale(1.08);
}

/* ===== PAINEL PERSONALIZAR ===== */
#personalizarOverlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.72);
    display:none;
    z-index:600;
    backdrop-filter:blur(4px);
}
#personalizarBox{
    position:fixed;
    bottom:-100%;
    left:0;right:0;
    background:linear-gradient(180deg,#181818 0%,#111 100%);
    border-top:1px solid #2a2a2a;
    border-radius:24px 24px 0 0;
    z-index:601;
    transition:bottom 0.38s cubic-bezier(0.34,1.45,0.64,1);
    padding:0 0 32px;
    box-shadow:0 -10px 50px rgba(0,0,0,0.7);
}
#personalizarBox.aberto{ bottom:0; }
.perso-handle{
    width:44px;height:4px;
    background:#2e2e2e;
    border-radius:4px;
    margin:13px auto 0;
}
.perso-titulo{
    font-size:16px;font-weight:700;
    text-align:center;
    padding:14px 20px 16px;
    color:#e8e8e8;
    border-bottom:1px solid #1f1f1f;
}
.perso-corpo{
    padding:18px 20px;
    display:flex;
    flex-direction:column;
    gap:18px;
}
.perso-grupo{
    display:flex;
    flex-direction:column;
    gap:6px;
}
.perso-label{
    font-size:12px;
    color:#777;
    letter-spacing:0.4px;
    text-transform:uppercase;
}
.perso-row{
    display:flex;
    align-items:center;
    gap:10px;
}
.perso-row input[type="color"]{
    width:44px;height:36px;
    border:1px solid #2a2a2a;
    border-radius:8px;
    background:#1c1c1c;
    cursor:pointer;
    padding:2px;
}
.perso-row select{
    flex:1;
    padding:9px 12px;
    border-radius:8px;
    border:1px solid #2a2a2a;
    background:#1c1c1c;
    color:#e8e8e8;
    font-size:13px;
    outline:none;
    cursor:pointer;
}
.perso-preview-text{
    font-size:13px;
    color:#888;
    padding:10px 14px;
    border-radius:8px;
    background:#0f0f0f;
    border:1px solid #1f1f1f;
    text-align:center;
    transition:all 0.2s;
}
.perso-btns{
    display:flex;
    gap:10px;
    padding:0 20px;
    margin-top:4px;
}
.perso-btns button{
    flex:1;padding:11px;
    border-radius:10px;border:none;
    font-size:14px;font-weight:600;
    cursor:pointer;transition:all 0.2s;
    margin-top:0;
}
.perso-salvar{ background:#1da1f2;color:white; }
.perso-salvar:hover{ opacity:0.85; }
.perso-cancelar{ background:#1c1c1c;color:#bbb; }
.perso-cancelar:hover{ background:#2a2a2a; }

@keyframes fadeIn{
    from{opacity:0;}
    to{opacity:1;}
}

/* ================= TAB BAR ================= */
#tabBar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: 62px;
    background: #0f0f0f;
    border-top: 1px solid #1f1f1f;
    display: flex;
    align-items: center;
    justify-content: space-around;
    z-index: 90;
    padding-bottom: env(safe-area-inset-bottom, 0px);
}

.tab-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    cursor: pointer;
    padding: 8px 14px;
    border-radius: 14px;
    transition: all 0.2s ease;
    -webkit-tap-highlight-color: transparent;
    flex: 1;
    position: relative;
}

.tab-item:active {
    transform: scale(0.88);
}

.tab-icon {
    font-size: 22px;
    line-height: 1;
    transition: transform 0.2s ease;
}

.tab-label {
    font-size: 10px;
    color: #555;
    letter-spacing: 0.2px;
    font-weight: 500;
    transition: color 0.2s;
}

.tab-item.active .tab-label {
    color: #1da1f2;
}

.tab-item.active .tab-icon {
    transform: scale(1.12);
}

.tab-item.active::after {
    content: '';
    position: absolute;
    bottom: 3px;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: #1da1f2;
    animation: tabDotIn 0.25s ease both;
}

@keyframes tabDotIn {
    from { transform: scale(0); opacity: 0; }
    to   { transform: scale(1); opacity: 1; }
}
</style>
</head>

<body>

<header>
    <span onclick="voltar()" style="cursor:pointer;">⬅</span>
    Perfil
</header>

<div id="perfil" style="position:relative;">
    <input type="file" id="fotoPerfilInput" accept="image/*" hidden>

    <!-- Botão lápis personalizar - só aparece no próprio perfil -->
    <div id="btnPersonalizar" class="btn-personalizar" onclick="abrirPersonalizar()" style="display:none;" title="Personalizar perfil">✏️</div>

    <div class="avatar" id="avatar" onclick="trocarFoto()"></div>

    <!-- Nome + badge verificado -->
    <div class="nome-linha">
        <span class="nome" id="nome"></span>
        <span class="badge-verificado" id="badgePerfil" style="display:none;">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="12" cy="12" r="12" fill="#1da1f2"/>
                <path d="M6.5 12.5L10 16L17.5 8.5" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </span>
    </div>

    <div id="bioEl" style="margin-top:6px;font-size:14px;color:#aaa;max-width:300px;margin-left:auto;margin-right:auto;word-break:break-word;"></div>
    <div id="editBioBtn" style="display:none;margin-top:4px;">
        <span onclick="editarBio()" style="font-size:12px;color:#1da1f2;cursor:pointer;">✏️ Editar bio</span>
    </div>

    <div class="stats">
        <div class="stat-item" onclick="abrirModal('seguidores')">
            <span class="stat-num" id="seguidoresNum">0</span>
            <span class="stat-label">seguidores</span>
        </div>
        <span class="stat-dot">·</span>
        <div class="stat-item" onclick="abrirModal('seguindo')">
            <span class="stat-num" id="seguindoNum">0</span>
            <span class="stat-label">seguindo</span>
        </div>
    </div>

    <button id="btnSeguir" onclick="seguir()">Seguir</button>
</div>

<div id="posts"></div>

<!-- MODAL BALÃO -->
<div id="modalOverlay" onclick="fecharModal()"></div>

<div id="modalBalao">
    <div class="modal-handle"></div>
    <div class="modal-titulo" id="modalTitulo"></div>
    <div class="modal-lista" id="modalLista">
        <div class="modal-loading">Carregando...</div>
    </div>
</div>

<!-- MODAL PERSONALIZAR PERFIL -->
<div id="personalizarOverlay" onclick="fecharPersonalizar()"></div>
<div id="personalizarBox">
    <div class="perso-handle"></div>
    <div class="perso-titulo">✏️ Personalizar Perfil</div>
    <div class="perso-corpo">
        <div class="perso-grupo">
            <div class="perso-label">Cor de fundo do perfil</div>
            <div class="perso-row">
                <input type="color" id="persoCorFundo" value="#0b0b0b">
                <span style="font-size:12px;color:#666;">Cor do fundo</span>
            </div>
        </div>
        <div class="perso-grupo">
            <div class="perso-label">Cor do texto da bio</div>
            <div class="perso-row">
                <input type="color" id="persoCorBio" value="#aaaaaa">
                <span style="font-size:12px;color:#666;">Cor da bio</span>
            </div>
        </div>
        <div class="perso-grupo">
            <div class="perso-label">Fonte do nome e bio</div>
            <select id="persoFonte" onchange="atualizarPreview()">
                <option value="system-ui">Padrão (System)</option>
                <option value="'Georgia', serif">Georgia (Serifada)</option>
                <option value="'Courier New', monospace">Courier New (Mono)</option>
                <option value="'Arial', sans-serif">Arial</option>
                <option value="'Trebuchet MS', sans-serif">Trebuchet MS</option>
                <option value="cursive">Cursiva</option>
                <option value="fantasy">Fantasy</option>
            </select>
        </div>
        <div class="perso-grupo">
            <div class="perso-label">Pré-visualização</div>
            <div class="perso-preview-text" id="persoPreview">@SeuNome — bio aqui...</div>
        </div>
    </div>
    <div class="perso-btns">
        <button class="perso-cancelar" onclick="fecharPersonalizar()">Cancelar</button>
        <button class="perso-salvar" onclick="salvarPersonalizar()">Salvar</button>
    </div>
</div>

<!-- ================= TAB BAR ================= -->
<nav id="tabBar">
    <div class="tab-item" id="tab-feed" onclick="window.location.href='index.html'">
        <span class="tab-icon">🏠</span>
        <span class="tab-label">Feed</span>
    </div>
    <div class="tab-item" id="tab-chat" onclick="irParaChat()">
        <span class="tab-icon">💬</span>
        <span class="tab-label">Chat</span>
    </div>
    <div class="tab-item" id="tab-veez" onclick="window.location.href='veez.html'">
        <span class="tab-icon">▶️</span>
        <span class="tab-label">Veez</span>
    </div>
    <div class="tab-item active" id="tab-perfil">
        <span class="tab-icon">👤</span>
        <span class="tab-label">Perfil</span>
    </div>
</nav>

<script>
const firebaseConfig = {
    databaseURL: "https://contaevilution-default-rtdb.firebaseio.com/"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const aparenciasDB = firebase.initializeApp({
    databaseURL: "https://coins-301c2-default-rtdb.firebaseio.com/"
}, "aparencias").database();

/* ================= VERIFICADO ================= */

const usuariosVerificados = [
    "Macedo",
    "Evolution Studio Official",
    "João Antônio"
];

function eVerificado(nome) {
    return usuariosVerificados.includes(nome);
}

const SVG_BADGE = `<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
    <circle cx="12" cy="12" r="12" fill="#1da1f2"/>
    <path d="M6.5 12.5L10 16L17.5 8.5" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>`;

/* ================= USUÁRIO ================= */

let user = localStorage.getItem("user");
let perfil = localStorage.getItem("perfil");

if(!perfil) location.href = "index.html";

document.getElementById("nome").innerText = "@" + perfil;

// Mostrar badge no perfil se verificado
if (eVerificado(perfil)) {
    document.getElementById("badgePerfil").style.display = "inline-flex";
}

/* ================= VOLTAR ================= */

function voltar(){ history.back(); }

/* ================= TAB CHAT ================= */

function irParaChat() {
    // Ajuste conforme o nome correto do seu arquivo de chat
    if (typeof abrirchat === 'function') {
        abrirchat();
    } else {
        window.location.href = 'chat.html';
    }
}

/* ================= LINKS ================= */

function linkificar(texto) {
    if (!texto) return "";
    let escaped = texto
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;");
    return escaped.replace(
        /(https?:\/\/[^\s]+)/g,
        '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>'
    );
}

/* ================= BIO ================= */

function carregarBio() {
    db.ref("bios/" + perfil).on("value", snap => {
        let bioEl = document.getElementById("bioEl");
        let editBioBtn = document.getElementById("editBioBtn");

        if (snap.exists()) {
            bioEl.innerHTML = linkificar(snap.val());
            bioEl.style.color = "#aaa";
        } else {
            bioEl.innerText = user === perfil ? "Toque em ✏️ para adicionar uma bio" : "";
            bioEl.style.color = "#555";
        }

        if (user === perfil) {
            editBioBtn.style.display = "block";
            // Mostrar botão lápis de personalização
            document.getElementById("btnPersonalizar").style.display = "flex";
        }
    });
}

function editarBio() {
    let atual = document.getElementById("bioEl").innerText;
    let nova = prompt("Editar bio (máx. 150 caracteres):", atual === "Toque em ✏️ para adicionar uma bio" ? "" : atual);
    if (nova === null) return;
    nova = nova.trim().substring(0, 150);
    db.ref("bios/" + user).set(nova || null);
}

/* ================= FOTO PERFIL ================= */

function trocarFoto(){
    if(user !== perfil) return;
    document.getElementById("fotoPerfilInput").click();
}

function comprimirImagem(file){
    return new Promise(resolve=>{
        let img = new Image();
        let reader = new FileReader();
        reader.onload = e => img.src = e.target.result;
        img.onload = ()=>{
            let canvas = document.createElement("canvas");
            let max = 300;
            let scale = Math.min(max / img.width, max / img.height, 1);
            canvas.width = img.width * scale;
            canvas.height = img.height * scale;
            let ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL("image/jpeg", 0.5));
        };
        reader.readAsDataURL(file);
    });
}

fotoPerfilInput.addEventListener("change", ()=>{
    let file = fotoPerfilInput.files[0];
    if(!file) return;
    comprimirImagem(file).then(base64=>{
        db.ref("fotosPerfil/" + user).set(base64);
    });
});

function carregarFotoPerfil(){
    db.ref("fotosPerfil/" + perfil).on("value", snap=>{
        let avatar = document.getElementById("avatar");
        if(snap.exists()){
            avatar.innerHTML = `<img src="${snap.val()}">`;
        } else {
            avatar.innerText = perfil.charAt(0).toUpperCase();
        }
    });
}

/* ================= SEGUIR ================= */

function seguir(){
    let refSeguidor = db.ref("seguidores/" + perfil + "/" + user);
    let refSeguindo = db.ref("seguindo/" + user + "/" + perfil);
    refSeguidor.once("value").then(snap => {
        if(snap.exists()){
            refSeguidor.remove();
            refSeguindo.remove();
        } else {
            refSeguidor.set(true);
            refSeguindo.set(true);
        }
    });
}

function atualizarBotao(){
    if(user === perfil){
        btnSeguir.style.display = "none";
        return;
    }
    db.ref("seguidores/" + perfil + "/" + user).on("value", snap => {
        if(snap.exists()){
            btnSeguir.innerText = "Seguindo";
            btnSeguir.classList.add("seguindo");
        } else {
            btnSeguir.innerText = "Seguir";
            btnSeguir.classList.remove("seguindo");
        }
    });
}

/* ================= CONTADORES ================= */

function carregarSeguidores(){
    db.ref("seguidores/" + perfil).on("value", snap => {
        document.getElementById("seguidoresNum").innerText = snap.numChildren();
    });
}

function carregarSeguindo(){
    db.ref("seguindo/" + perfil).on("value", snap => {
        document.getElementById("seguindoNum").innerText = snap.numChildren();
    });
}

/* ================= MODAL BALÃO ================= */

async function abrirModal(tipo) {
    const overlay = document.getElementById("modalOverlay");
    const balao   = document.getElementById("modalBalao");
    const titulo  = document.getElementById("modalTitulo");
    const lista   = document.getElementById("modalLista");

    titulo.innerText = tipo === "seguidores" ? "👥 Seguidores" : "➡️ Seguindo";
    lista.innerHTML  = `<div class="modal-loading">⏳ Carregando...</div>`;

    overlay.style.display = "block";
    setTimeout(() => balao.classList.add("aberto"), 10);

    const ref = tipo === "seguidores"
        ? db.ref("seguidores/" + perfil)
        : db.ref("seguindo/" + perfil);

    const snap = await ref.once("value");

    if (!snap.exists() || snap.numChildren() === 0) {
        lista.innerHTML = `<div class="modal-vazio">${
            tipo === "seguidores"
                ? "Nenhum seguidor ainda 😶"
                : "Não segue ninguém ainda 😶"
        }</div>`;
        return;
    }

    const usernames = Object.keys(snap.val());
    lista.innerHTML = "";

    for (const username of usernames) {
        const [fotoSnap, bioSnap] = await Promise.all([
            db.ref("fotosPerfil/" + username).once("value"),
            db.ref("bios/" + username).once("value")
        ]);

        const item = document.createElement("div");
        item.className = "modal-user-item";
        item.onclick = () => irParaPerfil(username);

        const avatarDiv = document.createElement("div");
        avatarDiv.className = "modal-avatar";
        if (fotoSnap.exists()) {
            avatarDiv.innerHTML = `<img src="${fotoSnap.val()}" alt="${username}">`;
        } else {
            avatarDiv.innerText = username.charAt(0).toUpperCase();
        }

        const infoDiv = document.createElement("div");
        infoDiv.className = "modal-user-info";

        const nomeLinha = document.createElement("div");
        nomeLinha.className = "modal-nome-linha";

        const nomeSpan = document.createElement("span");
        nomeSpan.className = "modal-user-nome";
        nomeSpan.innerText = "@" + username;
        nomeLinha.appendChild(nomeSpan);

        if (eVerificado(username)) {
            const badgeSpan = document.createElement("span");
            badgeSpan.className = "modal-badge";
            badgeSpan.innerHTML = SVG_BADGE;
            nomeLinha.appendChild(badgeSpan);
        }

        infoDiv.appendChild(nomeLinha);

        if (bioSnap.exists() && bioSnap.val().trim()) {
            const bioDiv = document.createElement("div");
            bioDiv.className = "modal-user-bio";
            bioDiv.innerText = bioSnap.val();
            infoDiv.appendChild(bioDiv);
        }

        item.appendChild(avatarDiv);
        item.appendChild(infoDiv);
        lista.appendChild(item);
    }
}

function fecharModal() {
    const overlay = document.getElementById("modalOverlay");
    const balao   = document.getElementById("modalBalao");
    balao.classList.remove("aberto");
    setTimeout(() => { overlay.style.display = "none"; }, 370);
}

function irParaPerfil(username) {
    fecharModal();
    localStorage.setItem("perfil", username);
    setTimeout(() => location.reload(), 390);
}

/* ================= POSTS ================= */

function carregarPosts(){
    db.ref("posts")
    .orderByChild("user")
    .equalTo(perfil)
    .on("value", snap => {
        posts.innerHTML = "";
        let lista = [];
        snap.forEach(child => { lista.push(child.val()); });
        lista.reverse();
        lista.forEach(p => {
            let div = document.createElement("div");
            div.className = "post";
            div.innerHTML = `<div>${linkificar(p.text || "")}</div>`;
            if(p.photoBase64){
                let img = document.createElement("img");
                img.src = p.photoBase64;
                div.appendChild(img);
            }
            posts.appendChild(div);
        });
    });
}

/* ================= PERSONALIZAR PERFIL ================= */

function aplicarPersonalizacao(dados) {
    if (!dados) return;
    let perfilEl = document.getElementById("perfil");
    if (dados.corFundo) {
        perfilEl.style.background = dados.corFundo;
        document.body.style.background = dados.corFundo;
    }
    let bioEl = document.getElementById("bioEl");
    if (dados.corBio && bioEl) bioEl.style.color = dados.corBio;
    let nomeEl = document.getElementById("nome");
    if (dados.fonte) {
        if (nomeEl) nomeEl.style.fontFamily = dados.fonte;
        if (bioEl) bioEl.style.fontFamily = dados.fonte;
    }
}

function carregarPersonalizacao() {
    aparenciasDB.ref("aparencias/" + perfil).on("value", snap => {
        if (snap.exists()) {
            aplicarPersonalizacao(snap.val());
        }
    });
}

function abrirPersonalizar() {
    aparenciasDB.ref("aparencias/" + user).once("value").then(snap => {
        let salvo = snap.exists() ? snap.val() : {};
        document.getElementById("persoCorFundo").value = salvo.corFundo || "#0b0b0b";
        document.getElementById("persoCorBio").value = salvo.corBio || "#aaaaaa";
        if (salvo.fonte) document.getElementById("persoFonte").value = salvo.fonte;
        atualizarPreview();
    });

    document.getElementById("personalizarOverlay").style.display = "block";
    setTimeout(() => document.getElementById("personalizarBox").classList.add("aberto"), 10);
}

function fecharPersonalizar() {
    document.getElementById("personalizarBox").classList.remove("aberto");
    setTimeout(() => {
        document.getElementById("personalizarOverlay").style.display = "none";
    }, 400);
}

function atualizarPreview() {
    let fonte = document.getElementById("persoFonte").value;
    let corBio = document.getElementById("persoCorBio").value;
    let corFundo = document.getElementById("persoCorFundo").value;
    let prev = document.getElementById("persoPreview");
    prev.style.fontFamily = fonte;
    prev.style.color = corBio;
    prev.style.background = corFundo;
}

function salvarPersonalizar() {
    let dados = {
        corFundo: document.getElementById("persoCorFundo").value,
        corBio: document.getElementById("persoCorBio").value,
        fonte: document.getElementById("persoFonte").value
    };
    aparenciasDB.ref("aparencias/" + user).set(dados).then(() => {
        fecharPersonalizar();
    });
}

document.addEventListener("DOMContentLoaded", () => {
    ["persoCorFundo","persoCorBio"].forEach(id => {
        let el = document.getElementById(id);
        if (el) el.addEventListener("input", atualizarPreview);
    });
});
