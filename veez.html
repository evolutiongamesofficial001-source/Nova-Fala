<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Planta • Nova-Fala</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{--bg:#08090b;--card:#111318;--card2:#161920;--border:#1e2128;--accent:#3ddc84;--accent2:#7c3aed;--water:#1d9bf0;--sun:#f5a623;--danger:#e0555a;--grad:linear-gradient(135deg,#3ddc84,#1d9bf0);--text:#f1f2f4;--sub:#8b8f98;--tab-h:62px;}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;-webkit-tap-highlight-color:transparent;}
body{display:flex;flex-direction:column;}
*{scrollbar-width:thin;scrollbar-color:#1e2a40 transparent;}

/* ── HEADER ── */
header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 12px;background:rgba(10,11,14,0.72);backdrop-filter:blur(14px) saturate(160%);-webkit-backdrop-filter:blur(14px) saturate(160%);border-bottom:1px solid var(--border);flex-shrink:0;}
.logo{font-size:20px;font-weight:800;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:-0.5px;}
.pontos-chip{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:6px 12px;font-size:13px;font-weight:700;color:var(--sun);}
.pontos-chip svg{flex-shrink:0;}

/* ── PAGE ── */
#page{flex:1;overflow-y:auto;padding:18px 16px calc(24px);}
#page::-webkit-scrollbar{width:3px;}
#page::-webkit-scrollbar-thumb{background:#1e2a40;}

.plant-card{background:var(--card);border:1px solid var(--border);border-radius:22px;padding:22px 18px 20px;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;overflow:hidden;}
.plant-card::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% 0%, rgba(61,220,132,0.08), transparent 60%);pointer-events:none;}
.stage-label{font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--accent);}
.plant-name{font-size:17px;font-weight:800;color:var(--text);margin-bottom:4px;}
.plant-visual{width:180px;height:180px;display:flex;align-items:center;justify-content:center;}
.plant-visual svg{width:100%;height:100%;transition:filter .4s;}
.status-msg{font-size:12.5px;color:var(--sub);text-align:center;min-height:18px;margin-top:2px;line-height:1.5;max-width:280px;}

/* ── STATS ── */
.stats{display:flex;flex-direction:column;gap:12px;margin-top:16px;}
.stat-row{display:flex;flex-direction:column;gap:5px;}
.stat-top{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);font-weight:600;}
.stat-top span:last-child{color:var(--text);font-weight:700;}
.stat-bar{height:9px;background:var(--card2);border-radius:8px;overflow:hidden;border:1px solid var(--border);}
.stat-fill{height:100%;border-radius:8px;transition:width .5s ease;}
.stat-fill.agua{background:linear-gradient(90deg,#1d9bf0,#5fc4ff);}
.stat-fill.luz{background:linear-gradient(90deg,#f5a623,#ffd166);}
.stat-fill.saude{background:linear-gradient(90deg,#3ddc84,#7ef7b4);}

/* ── AÇÕES ── */
.acoes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px;}
.acao-btn{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px 6px 11px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;transition:transform .15s,border-color .2s,background .2s;color:var(--text);}
.acao-btn:active{transform:scale(0.94);}
.acao-btn:not(:disabled):hover{border-color:var(--accent);background:var(--card2);}
.acao-btn svg{flex-shrink:0;}
.acao-label{font-size:12.5px;font-weight:700;}
.acao-sub{font-size:10px;color:var(--sub);font-weight:500;}
.acao-btn:disabled{opacity:0.45;cursor:default;}

/* ── SEQUÊNCIA ── */
.seq-card{margin-top:18px;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
.seq-info{display:flex;flex-direction:column;gap:2px;}
.seq-titulo{font-size:12.5px;font-weight:700;color:var(--text);}
.seq-sub{font-size:11px;color:var(--sub);}
.seq-valor{font-size:22px;font-weight:800;color:var(--accent);}

/* ── HISTÓRICO ── */
.hist-titulo{font-size:12px;font-weight:700;letter-spacing:0.6px;text-transform:uppercase;color:var(--sub);margin:20px 0 10px 2px;}
#historico{display:flex;flex-direction:column;gap:6px;}
.hist-item{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 14px;font-size:12.5px;}
.hist-texto{color:var(--sub);}
.hist-pontos{font-weight:700;color:var(--accent);flex-shrink:0;margin-left:10px;}
.hist-pontos.neg{color:var(--danger);}
.hist-vazio{text-align:center;color:#3a3d44;font-size:12.5px;padding:18px 0;}

/* ── TAB BAR ── */
#tabBar{height:var(--tab-h);flex-shrink:0;background:rgba(10,11,14,0.85);backdrop-filter:blur(16px) saturate(160%);-webkit-backdrop-filter:blur(16px) saturate(160%);border-top:1px solid #1e2128;display:flex;align-items:center;justify-content:space-around;z-index:90;padding-bottom:env(safe-area-inset-bottom,0px);}
.tab-item{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;padding:8px 14px;border-radius:14px;transition:all 0.2s;flex:1;position:relative;}
.tab-item:active{transform:scale(0.88);}
.tab-icon-svg{color:#555;transition:color .2s,transform .2s ease;}
.tab-label{font-size:10px;color:#555;letter-spacing:0.2px;font-weight:500;transition:color .2s;}
.tab-item.active{background:rgba(61,220,132,0.08);}
.tab-item.active .tab-label{color:var(--accent);}
.tab-item.active .tab-icon-svg{color:var(--accent);transform:scale(1.12);}
.tab-item.active::after{content:'';position:absolute;bottom:3px;width:4px;height:4px;border-radius:50%;background:var(--accent);}

/* ── TOAST ── */
#toast{position:fixed;bottom:calc(var(--tab-h) + 14px);left:50%;transform:translateX(-50%) translateY(14px);background:var(--card);border:1px solid var(--border);border-radius:24px;padding:9px 20px;font-size:13px;font-weight:600;color:var(--accent);opacity:0;pointer-events:none;z-index:999;transition:opacity .3s,transform .3s;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.4);max-width:88vw;overflow:hidden;text-overflow:ellipsis;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
#toast.neg{color:var(--danger);}
</style>
</head>
<body>

<header>
  <span class="logo">Planta</span>
  <div class="pontos-chip">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="var(--sun)" stroke="none"><path d="M12 2l2.6 7.9H23l-6.7 4.9L18.9 23 12 17.9 5.1 23l2.6-8.2L1 9.9h8.4z"/></svg>
    <span id="pontosValor">0</span>
  </div>
</header>

<div id="page">
  <div class="plant-card">
    <div class="stage-label" id="stageLabel">Semente</div>
    <div class="plant-name" id="plantName">Minha planta</div>
    <div class="plant-visual" id="plantVisual"></div>
    <div class="status-msg" id="statusMsg">Cuide da sua planta todos os dias para ela crescer.</div>
  </div>

  <div class="stats">
    <div class="stat-row">
      <div class="stat-top"><span>Água</span><span id="aguaValor">100%</span></div>
      <div class="stat-bar"><div class="stat-fill agua" id="fillAgua" style="width:100%;"></div></div>
    </div>
    <div class="stat-row">
      <div class="stat-top"><span>Luz</span><span id="luzValor">100%</span></div>
      <div class="stat-bar"><div class="stat-fill luz" id="fillLuz" style="width:100%;"></div></div>
    </div>
    <div class="stat-row">
      <div class="stat-top"><span>Saúde</span><span id="saudeValor">100%</span></div>
      <div class="stat-bar"><div class="stat-fill saude" id="fillSaude" style="width:100%;"></div></div>
    </div>
  </div>

  <div class="acoes">
    <button class="acao-btn" id="btnRegar" onclick="regar()">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--water)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.7s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/></svg>
      <span class="acao-label">Regar</span>
      <span class="acao-sub" id="subRegar">Água</span>
    </button>
    <button class="acao-btn" id="btnSol" onclick="darSol()">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--sun)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.5"/><line x1="12" y1="1.5" x2="12" y2="4.5"/><line x1="12" y1="19.5" x2="12" y2="22.5"/><line x1="1.5" y1="12" x2="4.5" y2="12"/><line x1="19.5" y1="12" x2="22.5" y2="12"/><line x1="4.4" y1="4.4" x2="6.5" y2="6.5"/><line x1="17.5" y1="17.5" x2="19.6" y2="19.6"/><line x1="4.4" y1="19.6" x2="6.5" y2="17.5"/><line x1="17.5" y1="6.5" x2="19.6" y2="4.4"/></svg>
      <span class="acao-label">Sol</span>
      <span class="acao-sub" id="subSol">Luz</span>
    </button>
    <button class="acao-btn" id="btnAdubar" onclick="adubar()">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22V12"/><path d="M12 12C12 7 8 6 5 6c0 5 3 6.5 7 6z"/><path d="M12 12c0-4.5 3.5-6 7-6 0 5-3 6.5-7 6z"/></svg>
      <span class="acao-label">Adubar</span>
      <span class="acao-sub" id="subAdubar">Nutrir</span>
    </button>
  </div>

  <div class="seq-card">
    <div class="seq-info">
      <div class="seq-titulo">Sequência de cuidados</div>
      <div class="seq-sub" id="seqSub">Cuide da planta hoje para começar</div>
    </div>
    <div class="seq-valor" id="seqValor">0</div>
  </div>

  <div class="hist-titulo">Histórico recente</div>
  <div id="historico"><div class="hist-vazio">Nenhuma ação ainda</div></div>
</div>

<nav id="tabBar">
  <div class="tab-item" onclick="location.href='index.html'">
    <svg class="tab-icon-svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    <span class="tab-label">Feed</span>
  </div>
  <div class="tab-item" onclick="irChat()">
    <svg class="tab-icon-svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
    <span class="tab-label">Chat</span>
  </div>
  <div class="tab-item active">
    <svg class="tab-icon-svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22V12"/><path d="M12 12C12 7 8 6 5 6c0 5 3 6.5 7 6z"/><path d="M12 12c0-4.5 3.5-6 7-6 0 5-3 6.5-7 6z"/></svg>
    <span class="tab-label">Planta</span>
  </div>
  <div class="tab-item" onclick="irPerfil()">
    <svg class="tab-icon-svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    <span class="tab-label">Perfil</span>
  </div>
</nav>
<div id="toast"></div>

<script>
function gCookie(n){const m=document.cookie.match(new RegExp('(^| )'+n+'=([^;]+)'));return m?m[2]:null}
const user = localStorage.getItem("user")||sessionStorage.getItem("user")||gCookie("user");
if(!user) location.replace("login.html");

function irChat(){location.href="chat.html"}
function irPerfil(){localStorage.setItem("perfil",user);location.href="user.html"}

const CHAVE = "planta_"+user;
const TAXA_AGUA_DECAY = 3;
const TAXA_LUZ_DECAY = 2.5;
const TAXA_SAUDE_DECAY = 4;
const TAXA_SAUDE_REGEN = 1.5;
const COOLDOWN_REGAR = 3*3600000;
const COOLDOWN_SOL = 3*3600000;
const COOLDOWN_ADUBO = 20*3600000;

const ESTAGIOS = [
  {min:0,nome:"Semente"},
  {min:50,nome:"Broto"},
  {min:150,nome:"Muda"},
  {min:400,nome:"Planta jovem"},
  {min:800,nome:"Florescendo"}
];

function estadoPadrao(){
  return {
    nome:"Minha planta",
    agua:100,
    luz:100,
    saude:100,
    pontos:0,
    ultimaAtualizacao:Date.now(),
    ultimoRega:0,
    ultimoSol:0,
    ultimoAdubo:0,
    diasCuidados:0,
    ultimoDiaCuidado:null,
    historico:[]
  };
}

function carregar(){
  try{
    let raw = localStorage.getItem(CHAVE);
    if(!raw) return estadoPadrao();
    let s = JSON.parse(raw);
    return Object.assign(estadoPadrao(), s);
  }catch(e){
    return estadoPadrao();
  }
}

function salvar(){
  localStorage.setItem(CHAVE, JSON.stringify(estado));
}

let estado = carregar();

function clamp(v){ return Math.max(0, Math.min(100, v)); }

function aplicarDecaimento(){
  let agora = Date.now();
  let horas = (agora - estado.ultimaAtualizacao) / 3600000;
  if(horas <= 0) return;
  estado.agua = clamp(estado.agua - horas*TAXA_AGUA_DECAY);
  estado.luz = clamp(estado.luz - horas*TAXA_LUZ_DECAY);
  if(estado.agua < 20 || estado.luz < 20){
    estado.saude = clamp(estado.saude - horas*TAXA_SAUDE_DECAY);
  } else if(estado.agua > 40 && estado.luz > 40){
    estado.saude = clamp(estado.saude + horas*TAXA_SAUDE_REGEN);
  }
  estado.ultimaAtualizacao = agora;
}

function estagioAtual(){
  let idx = 0;
  for(let i=0;i<ESTAGIOS.length;i++){
    if(estado.pontos >= ESTAGIOS[i].min) idx = i;
  }
  return idx;
}

function adicionarHistorico(texto, pontos){
  estado.historico.unshift({texto:texto, pontos:pontos, time:Date.now()});
  if(estado.historico.length > 12) estado.historico.length = 12;
}

function registrarCuidadoDia(){
  let hoje = new Date().toDateString();
  if(estado.ultimoDiaCuidado === hoje) return;
  if(estado.ultimoDiaCuidado){
    let ontem = new Date(Date.now()-86400000).toDateString();
    estado.diasCuidados = (estado.ultimoDiaCuidado === ontem) ? estado.diasCuidados+1 : 1;
  } else {
    estado.diasCuidados = 1;
  }
  estado.ultimoDiaCuidado = hoje;
  if(estado.diasCuidados > 0 && estado.diasCuidados % 5 === 0){
    estado.pontos += 15;
    adicionarHistorico("Sequência de "+estado.diasCuidados+" dias! Bônus recebido.", 15);
  }
}

function toast(msg, neg){
  let el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.toggle("neg", !!neg);
  el.classList.add("show");
  clearTimeout(el._t);
  el._t = setTimeout(()=>el.classList.remove("show"), 2600);
}

function formatarRestante(ms){
  let h = Math.floor(ms/3600000);
  let m = Math.floor((ms%3600000)/60000);
  if(h > 0) return h+"h "+m+"min";
  return m+"min";
}

function regar(){
  aplicarDecaimento();
  let agora = Date.now();
  let restante = COOLDOWN_REGAR - (agora - estado.ultimoRega);
  if(restante > 0){
    toast("Aguarde "+formatarRestante(restante)+" para regar de novo.", true);
    return;
  }
  if(estado.agua < 40){
    estado.agua = clamp(estado.agua + 45);
    estado.pontos += 5;
    adicionarHistorico("Regada na medida certa", 5);
    toast("Água na medida certa. +5 pontos");
    registrarCuidadoDia();
  } else if(estado.agua < 80){
    estado.agua = clamp(estado.agua + 30);
    estado.pontos += 1;
    adicionarHistorico("Regada, mas ainda não precisava muito", 1);
    toast("Regada, mas não precisava tanto. +1 ponto");
    registrarCuidadoDia();
  } else {
    estado.agua = 100;
    estado.saude = clamp(estado.saude - 6);
    adicionarHistorico("Excesso de água", -6);
    toast("Excesso de água prejudica as raízes.", true);
  }
  estado.ultimoRega = agora;
  estado.ultimaAtualizacao = agora;
  salvar();
  render();
}

function darSol(){
  aplicarDecaimento();
  let agora = Date.now();
  let restante = COOLDOWN_SOL - (agora - estado.ultimoSol);
  if(restante > 0){
    toast("Aguarde "+formatarRestante(restante)+" para dar mais sol.", true);
    return;
  }
  if(estado.luz < 40){
    estado.luz = clamp(estado.luz + 45);
    estado.pontos += 5;
    adicionarHistorico("Luz na medida certa", 5);
    toast("Luz na medida certa. +5 pontos");
    registrarCuidadoDia();
  } else if(estado.luz < 80){
    estado.luz = clamp(estado.luz + 30);
    estado.pontos += 1;
    adicionarHistorico("Recebeu sol, mas ainda não precisava muito", 1);
    toast("Ainda não precisava de tanto sol. +1 ponto");
    registrarCuidadoDia();
  } else {
    estado.luz = 100;
    estado.saude = clamp(estado.saude - 6);
    adicionarHistorico("Excesso de luz", -6);
    toast("Excesso de sol pode queimar as folhas.", true);
  }
  estado.ultimoSol = agora;
  estado.ultimaAtualizacao = agora;
  salvar();
  render();
}

function adubar(){
  aplicarDecaimento();
  let agora = Date.now();
  let restante = COOLDOWN_ADUBO - (agora - estado.ultimoAdubo);
  if(restante > 0){
    toast("Aguarde "+formatarRestante(restante)+" para adubar de novo.", true);
    return;
  }
  if(estado.saude >= 98){
    estado.pontos += 2;
    adicionarHistorico("Adubo aplicado como manutenção", 2);
    toast("Planta já está saudável. +2 pontos");
  } else {
    estado.saude = clamp(estado.saude + 15);
    estado.pontos += 8;
    adicionarHistorico("Adubada corretamente", 8);
    toast("Ótimo cuidado! +8 pontos");
  }
  estado.ultimoAdubo = agora;
  estado.ultimaAtualizacao = agora;
  registrarCuidadoDia();
  salvar();
  render();
}

function corSaude(){
  if(estado.saude >= 60) return "#3ddc84";
  if(estado.saude >= 30) return "#f5a623";
  return "#e0555a";
}

function svgPlanta(){
  let idx = estagioAtual();
  let saudavel = estado.saude >= 50;
  let corFolha = saudavel ? "#3ddc84" : (estado.saude >= 25 ? "#c9a227" : "#8a5a3a");
  let corFolha2 = saudavel ? "#2bb86b" : (estado.saude >= 25 ? "#a8811c" : "#6f4429");
  let inclinacao = estado.saude < 40 ? "rotate(-6 90 150)" : "";

  let vaso = `<path d="M60 168 L120 168 L112 190 L68 190 Z" fill="#8a5a3a"/><rect x="55" y="160" width="70" height="10" rx="3" fill="#a06b45"/>`;

  if(idx === 0){
    return `<svg viewBox="0 0 180 200">${vaso}
      <ellipse cx="90" cy="158" rx="6" ry="4" fill="${corFolha}"/>
    </svg>`;
  }
  if(idx === 1){
    return `<svg viewBox="0 0 180 200"><g transform="${inclinacao}">${vaso}
      <path d="M90 160 L90 138" stroke="${corFolha2}" stroke-width="4" stroke-linecap="round"/>
      <ellipse cx="80" cy="134" rx="12" ry="7" fill="${corFolha}" transform="rotate(-20 80 134)"/>
      <ellipse cx="100" cy="134" rx="12" ry="7" fill="${corFolha}" transform="rotate(20 100 134)"/>
    </g></svg>`;
  }
  if(idx === 2){
    return `<svg viewBox="0 0 180 200"><g transform="${inclinacao}">${vaso}
      <path d="M90 160 L90 100" stroke="${corFolha2}" stroke-width="5" stroke-linecap="round"/>
      <ellipse cx="72" cy="128" rx="16" ry="9" fill="${corFolha}" transform="rotate(-25 72 128)"/>
      <ellipse cx="108" cy="128" rx="16" ry="9" fill="${corFolha}" transform="rotate(25 108 128)"/>
      <ellipse cx="68" cy="102" rx="14" ry="8" fill="${corFolha}" transform="rotate(-15 68 102)"/>
      <ellipse cx="112" cy="102" rx="14" ry="8" fill="${corFolha}" transform="rotate(15 112 102)"/>
      <ellipse cx="90" cy="94" rx="9" ry="14" fill="${corFolha2}"/>
    </g></svg>`;
  }
  if(idx === 3){
    return `<svg viewBox="0 0 180 200"><g transform="${inclinacao}">${vaso}
      <path d="M90 160 L90 70" stroke="${corFolha2}" stroke-width="6" stroke-linecap="round"/>
      <ellipse cx="62" cy="132" rx="20" ry="10" fill="${corFolha}" transform="rotate(-28 62 132)"/>
      <ellipse cx="118" cy="132" rx="20" ry="10" fill="${corFolha}" transform="rotate(28 118 132)"/>
      <ellipse cx="58" cy="100" rx="17" ry="9" fill="${corFolha}" transform="rotate(-18 58 100)"/>
      <ellipse cx="122" cy="100" rx="17" ry="9" fill="${corFolha}" transform="rotate(18 122 100)"/>
      <ellipse cx="66" cy="76" rx="14" ry="8" fill="${corFolha}" transform="rotate(-12 66 76)"/>
      <ellipse cx="114" cy="76" rx="14" ry="8" fill="${corFolha}" transform="rotate(12 114 76)"/>
      <ellipse cx="90" cy="64" rx="10" ry="16" fill="${corFolha2}"/>
    </g></svg>`;
  }
  let corFlor = saudavel ? "#ff9fd6" : "#c98aa8";
  return `<svg viewBox="0 0 180 200"><g transform="${inclinacao}">${vaso}
    <path d="M90 160 L90 60" stroke="${corFolha2}" stroke-width="6" stroke-linecap="round"/>
    <ellipse cx="58" cy="134" rx="20" ry="10" fill="${corFolha}" transform="rotate(-28 58 134)"/>
    <ellipse cx="122" cy="134" rx="20" ry="10" fill="${corFolha}" transform="rotate(28 122 134)"/>
    <ellipse cx="54" cy="102" rx="17" ry="9" fill="${corFolha}" transform="rotate(-18 54 102)"/>
    <ellipse cx="126" cy="102" rx="17" ry="9" fill="${corFolha}" transform="rotate(18 126 102)"/>
    <g transform="translate(90 54)">
      <ellipse cx="0" cy="-14" rx="9" ry="13" fill="${corFlor}"/>
      <ellipse cx="0" cy="14" rx="9" ry="13" fill="${corFlor}"/>
      <ellipse cx="-14" cy="0" rx="13" ry="9" fill="${corFlor}"/>
      <ellipse cx="14" cy="0" rx="13" ry="9" fill="${corFlor}"/>
      <circle cx="0" cy="0" r="8" fill="#ffd166"/>
    </g>
  </g></svg>`;
}

function statusTexto(){
  if(estado.saude < 25) return "Sua planta está fraca. Cuide dela com água e sol equilibrados.";
  if(estado.agua < 20) return "A terra está seca. Sua planta precisa de água.";
  if(estado.luz < 20) return "Sua planta precisa de mais luz solar.";
  if(estado.saude >= 90) return "Sua planta está linda e saudável.";
  return "Cuide da sua planta todos os dias para ela crescer.";
}

function render(){
  aplicarDecaimento();
  salvar();

  let idx = estagioAtual();
  document.getElementById("stageLabel").innerText = ESTAGIOS[idx].nome;
  document.getElementById("plantName").innerText = estado.nome;
  document.getElementById("plantVisual").innerHTML = svgPlanta();
  document.getElementById("statusMsg").innerText = statusTexto();
  document.getElementById("pontosValor").innerText = Math.floor(estado.pontos);

  document.getElementById("fillAgua").style.width = estado.agua+"%";
  document.getElementById("fillLuz").style.width = estado.luz+"%";
  document.getElementById("fillSaude").style.width = estado.saude+"%";
  document.getElementById("fillSaude").style.background = corSaude();
  document.getElementById("aguaValor").innerText = Math.round(estado.agua)+"%";
  document.getElementById("luzValor").innerText = Math.round(estado.luz)+"%";
  document.getElementById("saudeValor").innerText = Math.round(estado.saude)+"%";

  let agora = Date.now();
  let rRegar = COOLDOWN_REGAR - (agora - estado.ultimoRega);
  let rSol = COOLDOWN_SOL - (agora - estado.ultimoSol);
  let rAdubo = COOLDOWN_ADUBO - (agora - estado.ultimoAdubo);
  document.getElementById("btnRegar").disabled = rRegar > 0;
  document.getElementById("btnSol").disabled = rSol > 0;
  document.getElementById("btnAdubar").disabled = rAdubo > 0;
  document.getElementById("subRegar").innerText = rRegar > 0 ? formatarRestante(rRegar) : "Água";
  document.getElementById("subSol").innerText = rSol > 0 ? formatarRestante(rSol) : "Luz";
  document.getElementById("subAdubar").innerText = rAdubo > 0 ? formatarRestante(rAdubo) : "Nutrir";

  document.getElementById("seqValor").innerText = estado.diasCuidados;
  let hoje = new Date().toDateString();
  document.getElementById("seqSub").innerText = (estado.ultimoDiaCuidado === hoje)
    ? "Cuidado registrado hoje"
    : "Cuide da planta hoje para manter a sequência";

  let hist = document.getElementById("historico");
  if(!estado.historico.length){
    hist.innerHTML = '<div class="hist-vazio">Nenhuma ação ainda</div>';
  } else {
    hist.innerHTML = estado.historico.map(h=>{
      let sinal = h.pontos > 0 ? "+"+h.pontos : h.pontos;
      let classe = h.pontos < 0 ? "hist-pontos neg" : "hist-pontos";
      return `<div class="hist-item"><span class="hist-texto">${h.texto}</span><span class="${classe}">${sinal} pts</span></div>`;
    }).join("");
  }
}

render();
setInterval(render, 30000);
</script>
</body>
</html>
